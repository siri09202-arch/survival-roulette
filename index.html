<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Roulette - 生存ルーレット</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
            border: 2px solid transparent;
            background-clip: padding-box;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        [draggable="true"] {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .animate-out {
            animation: fadeOut 1s ease-out forwards;
        }
        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(-20px);
            }
        }
    </style>
</head>
<body class="bg-slate-950">
    <div id="app"></div>

    <script>
        // シンプルなUIコンポーネント - Vanillaで実装
        class SurvivalRoulette {
            constructor() {
                this.state = {
                    phase: 'home', // home, setup, playing, result
                    title: '',
                    mode: 'individual', // individual, team
                    teamCount: 2,
                    teamNames: ['チームA', 'チームB', 'チームC', 'チームD', 'チームE', 'チームF'],
                    playerListText: '',
                    manualPlayers: [],
                    players: [],
                    eliminated: [],
                    turn: 1,
                    isSpinning: false,
                    displayResult: { player: '？？？', amount: '？' },
                    lastResult: null,
                    logs: [],
                    initialHP: 1000,
                    spinDuration: 1.5,
                    healInterval: 10,
                    isHpBalanceEnabled: false,
                    isSpecialEventEnabled: false,
                    specialEventProb: 10,
                    numberFormat: 'default',
                    selectedPlayerIds: [],
                    isManualSelectionPhase: false,
                    config: {
                        rangeMin: 1,
                        rangeMax: 20,
                        rangeProb: 70,
                        fixedItems: [
                            { id: 1, value: 50, prob: 20 },
                            { id: 2, value: 100, prob: 10 }
                        ]
                    },
                    reviveEvents: [
                        { id: 1, turn: 50, type: 'steal' },
                        { id: 2, turn: 100, type: 'copy' }
                    ]
                };
            }

            render() {
                const app = document.getElementById('app');
                
                if (this.state.phase === 'home') {
                    app.innerHTML = this.renderHome();
                } else if (this.state.phase === 'setup') {
                    app.innerHTML = this.renderSetup();
                } else if (this.state.phase === 'playing') {
                    app.innerHTML = this.renderPlaying();
                } else if (this.state.phase === 'result') {
                    app.innerHTML = this.renderResult();
                }
                
                this.attachEventListeners();
            }

            renderHome() {
                return `
                    <div class="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-6 relative overflow-hidden">
                        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-indigo-600/20 rounded-full blur-[120px] pointer-events-none"></div>
                        <div class="z-10 text-center max-w-xl w-full">
                            <div class="mb-4 inline-block p-4 bg-indigo-900/50 rounded-3xl border border-indigo-500/30">⚔️</div>
                            <h1 class="text-5xl md:text-7xl font-black italic tracking-tighter text-white drop-shadow-2xl mb-12 uppercase leading-none">Survival<br/><span class="text-indigo-400">Roulette</span></h1>
                            <div class="flex flex-col gap-4">
                                <button id="btn-single" class="w-full py-5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl font-black text-2xl transition-all shadow-[0_0_30px_rgba(79,70,229,0.4)] flex items-center justify-center gap-3">👥 ひとりで遊ぶ</button>
                                <button disabled class="w-full py-5 bg-slate-900 border-2 border-slate-700 text-slate-300 rounded-2xl font-black text-2xl flex items-center justify-center gap-3 opacity-60 cursor-not-allowed">⚡ みんなで遊ぶ (準備中)</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderSetup() {
                const totalProb = (parseInt(this.state.config.rangeProb) || 0) + 
                    this.state.config.fixedItems.reduce((sum, item) => sum + (parseInt(item.prob) || 0), 0);
                
                return `
                    <div class="min-h-screen bg-slate-950 text-slate-100 p-4 md:p-6 flex items-center justify-center">
                        <div class="w-full max-w-5xl bg-slate-900 rounded-[2.5rem] shadow-2xl border border-slate-800 overflow-hidden">
                            <div class="bg-gradient-to-br from-indigo-600 to-indigo-800 p-6 text-center relative overflow-hidden shrink-0">
                                <h1 class="text-2xl md:text-3xl font-black italic tracking-tighter text-white drop-shadow-lg uppercase">SURVIVAL ROULETTE - セットアップ</h1>
                            </div>
                            
                            <div class="p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 overflow-y-auto custom-scrollbar max-h-[80vh]">
                                <!-- 左側設定 -->
                                <div class="space-y-4">
                                    <label class="text-[10px] font-black text-slate-500 tracking-widest uppercase">⚙️ 基本設定</label>
                                    <div class="p-3 bg-slate-950 rounded-2xl border border-slate-800 space-y-2">
                                        <label class="text-[8px] font-black text-slate-500 tracking-widest block uppercase">タイトル</label>
                                        <input type="text" id="input-title" placeholder="ゲームのタイトルを入力..." value="${this.state.title}" class="bg-transparent text-sm font-bold w-full outline-none text-white border-b border-slate-800 focus:border-indigo-500 pb-1" />
                                        <div class="flex gap-1 pt-2">
                                            <button class="mode-btn px-4 py-1.5 text-[10px] font-black rounded-lg transition-all bg-indigo-600 text-white" data-mode="individual">個人戦</button>
                                            <button class="mode-btn px-4 py-1.5 text-[10px] font-black rounded-lg transition-all bg-slate-900 text-slate-500 hover:text-slate-300" data-mode="team">チーム戦</button>
                                        </div>
                                    </div>
                                    <div class="grid grid-cols-2 gap-3">
                                        <div class="p-3 bg-slate-950 rounded-2xl border border-slate-800">
                                            <label class="text-[8px] font-black text-slate-500 block mb-1 uppercase">初期HP</label>
                                            <input type="number" id="input-hp" value="${this.state.initialHP}" class="bg-transparent text-lg font-black w-full outline-none text-indigo-400" />
                                        </div>
                                        <div class="p-3 bg-slate-950 rounded-2xl border border-slate-800">
                                            <label class="text-[8px] font-black text-slate-500 block mb-1 uppercase">速度</label>
                                            <input type="number" id="input-speed" step="0.1" value="${this.state.spinDuration}" class="bg-transparent text-lg font-black w-full outline-none text-amber-500" />
                                        </div>
                                    </div>
                                </div>

                                <!-- プレイヤーリスト -->
                                <div class="space-y-4">
                                    <label class="text-[10px] font-black text-slate-500 tracking-widest block uppercase">👥 プレイヤーリスト</label>
                                    <textarea id="input-players" placeholder="名前を改行で入力..." class="w-full h-64 bg-slate-950 border border-slate-800 rounded-2xl p-4 outline-none focus:ring-2 focus:ring-indigo-500 font-bold text-sm custom-scrollbar resize-none">${this.state.playerListText}</textarea>
                                </div>

                                <!-- ルール設定 -->
                                <div class="space-y-4">
                                    <label class="text-[10px] font-black text-slate-500 tracking-widest block uppercase">% ルーレット構成</label>
                                    <div class="p-4 bg-slate-950 rounded-2xl border border-slate-800 space-y-3">
                                        <div class="flex justify-between items-center">
                                            <span class="text-[10px] font-black text-slate-400">ランダム範囲</span>
                                            <div class="flex items-center gap-1">
                                                <input type="number" id="input-range-prob" value="${this.state.config.rangeProb}" class="bg-transparent text-[10px] font-black w-6 outline-none text-indigo-400 text-right" />
                                                <span class="text-[8px]">%</span>
                                            </div>
                                        </div>
                                        <div class="flex items-center gap-2">
                                            <input type="number" id="input-range-min" value="${this.state.config.rangeMin}" class="w-full bg-slate-900 p-2 rounded-xl text-center font-black text-xs border border-slate-800" />
                                            <span>~</span>
                                            <input type="number" id="input-range-max" value="${this.state.config.rangeMax}" class="w-full bg-slate-900 p-2 rounded-xl text-center font-black text-xs border border-slate-800" />
                                        </div>
                                    </div>

                                    <button id="btn-hp-balance" class="w-full p-3 rounded-2xl border flex items-center justify-between transition-all ${this.state.isHpBalanceEnabled ? 'bg-emerald-600/10 border-emerald-500 text-white' : 'bg-slate-950 border-slate-800 text-slate-500'}">
                                        <span class="text-[10px] font-black uppercase">⚖️ HP調整</span>
                                        <div class="px-2 py-0.5 rounded text-[8px] font-black ${this.state.isHpBalanceEnabled ? 'bg-emerald-600' : 'bg-slate-800'}">${this.state.isHpBalanceEnabled ? 'ON' : 'OFF'}</div>
                                    </button>
                                </div>
                            </div>

                            <div class="flex gap-4 p-6 bg-slate-950 border-t border-slate-800">
                                <button id="btn-back" class="px-6 py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-black transition-all">戻る</button>
                                <button id="btn-start" ${totalProb !== 100 || this.state.manualPlayers.length < 2 ? 'disabled' : ''} class="flex-1 py-4 rounded-2xl font-black text-xl transition-all flex items-center justify-center gap-3 text-white ${totalProb === 100 && this.state.manualPlayers.length >= 2 ? 'bg-indigo-600 hover:bg-indigo-500 cursor-pointer' : 'bg-slate-800 text-slate-600 cursor-not-allowed opacity-50'}">
                                    ▶️ ゲーム開始
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderPlaying() {
                const nextEvent = this.getNextEvent();
                const survivorsSorted = this.state.players.filter(p => p.status === 'alive').sort((a, b) => b.hp - a.hp);
                const isHealTurn = this.state.turn % this.state.healInterval === 0 && !this.state.reviveEvents.some(r => r.turn === this.state.turn);
                const currentReviveEvent = this.state.reviveEvents.find(r => r.turn === this.state.turn);
                const isReviveTurn = !!currentReviveEvent;

                return `
                    <div class="min-h-screen bg-slate-950 text-slate-100 p-4 md:p-6 flex flex-col md:flex-row gap-6 max-w-[1500px] mx-auto font-sans">
                        <div class="flex-1 flex flex-col gap-6">
                            <div class="bg-slate-900 rounded-3xl p-6 border-b-4 border-indigo-600 flex justify-between items-center shadow-2xl">
                                <div class="flex items-center gap-5 truncate">
                                    <div class="w-14 h-14 bg-indigo-600 rounded-2xl flex items-center justify-center font-black text-2xl text-white tabular-nums shrink-0">${this.state.turn}</div>
                                    <div class="truncate">
                                        <div class="text-indigo-400 font-black text-[11px] tracking-widest uppercase truncate">${this.state.title}</div>
                                        <div class="text-xl font-black italic text-white truncate">${isReviveTurn ? 'SPECIAL EVENT' : isHealTurn ? 'HEALING TIME' : 'BATTLE ROUND'}</div>
                                    </div>
                                </div>
                                <div class="text-right px-5 py-3 bg-slate-950 rounded-2xl border border-slate-800 shrink-0">
                                    <div class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">${nextEvent.name}まで</div>
                                    <div class="text-base font-black text-amber-500 italic">${nextEvent.remaining === "-" ? "CLIMAX" : nextEvent.remaining + ' TURN'}</div>
                                </div>
                            </div>

                            <div class="bg-slate-900 rounded-[3rem] p-8 border border-slate-800 flex flex-col items-center justify-center relative flex-1">
                                <div class="absolute top-8 right-10 flex flex-col items-end gap-2 z-10">
                                    ${isReviveTurn ? '<div class="bg-purple-600 text-white px-5 py-2 rounded-xl text-sm font-black animate-pulse flex items-center gap-2">✨ REVIVE</div>' : isHealTurn ? '<div class="bg-emerald-600 text-white px-5 py-2 rounded-xl text-sm font-black flex items-center gap-2">❤️ HEAL</div>' : '<div class="bg-slate-950 text-red-500 border border-red-900/40 px-5 py-2 rounded-xl text-xs font-black uppercase tracking-[0.2em]">Battle Phase</div>'}
                                </div>
                                
                                <div class="text-center w-full px-6 relative z-10 flex flex-col items-center">
                                    <div class="text-3xl md:text-5xl lg:text-6xl font-black mb-6 tracking-tighter italic truncate max-w-full ${this.state.lastResult?.isReverse || this.state.lastResult?.isMulti ? 'text-amber-400' : 'text-white'}">${this.state.displayResult.player}</div>
                                    <div class="text-[5rem] md:text-[8rem] lg:text-[9rem] font-black leading-none transition-all duration-75 tabular-nums break-all ${this.state.isSpinning ? 'text-slate-800 scale-95 blur-[2px]' : (this.state.lastResult?.type === 'heal' || this.state.lastResult?.type === 'revive' ? 'text-emerald-400' : 'text-red-600')}">
                                        ${this.state.displayResult.amount}
                                    </div>
                                </div>
                                
                                <div class="mt-10 w-full max-w-[320px] relative z-10">
                                    ${this.state.isManualSelectionPhase ? `
                                        <div class="space-y-4 w-full">
                                            <div class="text-[10px] font-black text-indigo-400 uppercase tracking-widest text-center animate-pulse">対象を選択してください</div>
                                            <button id="btn-apply-selection" class="w-full py-6 rounded-[2rem] font-black text-2xl shadow-2xl transition-all active:scale-95 border-b-[10px] flex items-center justify-center gap-4 bg-indigo-600 border-indigo-900 text-white">⚡ APPLY (${this.state.selectedPlayerIds.length})</button>
                                        </div>
                                    ` : `
                                        <button id="btn-spin" ${this.state.isSpinning ? 'disabled' : ''} class="w-full py-6 rounded-[2rem] font-black text-2xl shadow-2xl transition-all active:scale-95 border-b-[10px] flex items-center justify-center gap-4 text-white ${this.state.isSpinning ? 'bg-slate-800 border-slate-950 text-slate-600' : isReviveTurn ? 'bg-purple-600 border-purple-900' : isHealTurn ? 'bg-emerald-600 border-emerald-900' : 'bg-red-600 border-red-900 hover:brightness-110'}">
                                            🎡 ${this.state.isSpinning ? 'SPINNING...' : 'SPIN'}
                                        </button>
                                    `}
                                </div>
                            </div>

                            <div class="bg-slate-900 rounded-3xl p-6 border border-slate-800 flex flex-col overflow-hidden h-[200px]">
                                <div class="text-slate-500 font-black text-[11px] tracking-[0.3em] uppercase flex items-center gap-2 mb-4">📜 LOGS</div>
                                <div class="overflow-y-auto flex-1 space-y-2 pr-1 custom-scrollbar">
                                    ${this.state.logs.slice(0, 20).map((log, i) => `
                                        <div class="flex items-center gap-4 p-4 rounded-2xl border ${log.type === 'damage' ? 'bg-red-500/5 border-red-500/10' : log.type === 'heal' ? 'bg-emerald-500/5 border-emerald-500/10' : 'bg-slate-950 border-slate-800/60'}">
                                            <div class="w-10 h-10 bg-slate-900 rounded-xl flex items-center justify-center shrink-0 font-black text-[10px] text-slate-500">T${log.turn}</div>
                                            <span class="text-sm font-bold truncate flex-1 ${log.type === 'death' ? 'text-red-400' : 'text-slate-200'}">${log.message}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>

                        <!-- 右側パネル -->
                        <div class="md:w-[360px] flex flex-col gap-6">
                            <div class="bg-slate-900 rounded-[2.5rem] p-6 border border-slate-800 flex flex-col">
                                <div class="text-slate-500 font-black text-[11px] mb-5 uppercase flex items-center justify-between px-2 tracking-[0.2em]">
                                    <span class="flex items-center gap-2 text-white">👥 Survivors</span>
                                    <span class="bg-indigo-600 text-white px-3 py-1 rounded-full text-[11px] tabular-nums">${survivorsSorted.length}</span>
                                </div>
                                <div class="space-y-3 overflow-y-auto flex-1 pr-1 custom-scrollbar max-h-[300px]">
                                    ${survivorsSorted.map(p => {
                                        const isLowHp = p.hp <= this.state.initialHP * 0.3;
                                        const isSelected = this.state.selectedPlayerIds.includes(p.id);
                                        return `
                                            <div class="player-card bg-slate-950 p-4 rounded-2xl border flex flex-col gap-2 group relative overflow-hidden transition-all cursor-pointer ${isSelected ? 'border-indigo-500 ring-4 ring-indigo-500/20 bg-indigo-500/5' : (isLowHp ? 'border-red-900 animate-pulse bg-red-950/10' : 'border-slate-800 hover:border-slate-700')}" data-player-id="${p.id}">
                                                <div class="flex justify-between items-center">
                                                    <div class="flex items-center gap-2 truncate pr-2">
                                                        ${this.state.isManualSelectionPhase ? `<div class="w-4 h-4 rounded border shrink-0 flex items-center justify-center ${isSelected ? 'bg-indigo-600 border-indigo-600' : 'border-slate-700'}">✓</div>` : ''}
                                                        ${isLowHp ? '<span>⚠️</span>' : ''}
                                                        <span class="font-bold text-sm truncate italic text-slate-200">${p.name}</span>
                                                    </div>
                                                    <span class="text-lg font-black tabular-nums ${isLowHp ? 'text-red-500' : 'text-emerald-400'}">${p.hp}</span>
                                                </div>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>

                            <div class="bg-slate-900 rounded-[2.5rem] p-6 border border-slate-800 flex flex-col flex-1 overflow-hidden">
                                <div class="text-slate-500 font-black text-[11px] uppercase flex items-center gap-2 mb-4 tracking-[0.2em] px-2">🏆 Ranking</div>
                                <div class="space-y-2 overflow-y-auto flex-1 pr-1 custom-scrollbar">
                                    ${this.getCombinedRanking().map((p, index) => {
                                        const isAlive = p.status === 'alive';
                                        const isFirst = index === 0 && isAlive;
                                        return `
                                            <div class="flex items-center justify-between p-4 rounded-2xl border transition-all ${isFirst ? 'bg-indigo-600/30 border-indigo-400' : isAlive ? 'bg-slate-900 border-slate-700' : 'bg-slate-950/60 border-slate-900 opacity-60'}">
                                                <div class="flex items-center gap-4 overflow-hidden">
                                                    <span class="font-black text-lg w-8 shrink-0 ${isFirst ? 'text-amber-400' : 'text-slate-500'}">${index + 1}</span>
                                                    <span class="font-bold text-base truncate ${isAlive ? 'text-white' : 'text-slate-400'}">${p.name}</span>
                                                </div>
                                                <div class="text-right shrink-0">
                                                    ${isAlive ? `<span class="font-black text-sm px-3 py-1.5 rounded-xl border bg-emerald-500/10 text-emerald-400 border-emerald-500/20">HP ${p.hp}</span>` : `<span class="text-slate-500 font-bold text-xs px-3 py-1.5 bg-slate-800/40 rounded-xl border border-slate-800/50">T${p.turn}脱落</span>`}
                                                </div>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderResult() {
                const combinedRanking = this.getCombinedRanking();
                const alivePlayers = this.state.players.filter(p => p.status === 'alive');
                const hasWinner = alivePlayers.length > 0;

                return `
                    <div class="min-h-screen bg-slate-950 text-slate-100 p-4 md:p-8 flex flex-col items-center justify-center max-w-[1000px] mx-auto">
                        <div class="w-full bg-slate-900 border border-slate-800 rounded-[2.5rem] p-6 md:p-10 shadow-2xl flex flex-col gap-6">
                            <div class="text-center relative">
                                <div class="inline-block p-4 bg-indigo-900/30 rounded-3xl border border-indigo-500/20 mb-3 text-indigo-400">
                                    🏆
                                </div>
                                <h1 class="text-3xl md:text-5xl font-black italic uppercase tracking-tighter text-white">RESULT</h1>
                                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mt-1">生存競争、決着</p>
                            </div>

                            <div class="bg-slate-950 border border-slate-800/80 rounded-3xl p-6 text-center max-w-lg mx-auto w-full">
                                <div class="text-[10px] font-black text-indigo-400 tracking-[0.2em] uppercase mb-1">WINNER</div>
                                ${hasWinner ? `
                                    <div>
                                        <div class="text-2xl md:text-3xl font-black text-amber-400 mb-1">
                                            ${alivePlayers[0].name}
                                        </div>
                                        <div class="text-slate-400 text-xs font-bold">
                                            第${this.state.turn}ターンを耐え抜き、勝利を掴み取った！
                                        </div>
                                    </div>
                                ` : `
                                    <div class="text-slate-500 font-bold text-lg">勝者なし (全員脱落)</div>
                                `}
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
                                <div class="bg-slate-950 border border-slate-800/60 rounded-3xl p-4 flex flex-col h-full overflow-hidden">
                                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-3 px-1 flex items-center gap-2">
                                        🏆 最終順位
                                    </label>
                                    <div class="space-y-2 overflow-y-auto flex-1 pr-1 custom-scrollbar">
                                        ${combinedRanking.map((p, index) => {
                                            const isAlive = p.status === 'alive';
                                            const isFirst = index === 0 && isAlive;
                                            return `
                                                <div class="flex items-center justify-between p-4 rounded-2xl border transition-all ${isFirst ? 'bg-indigo-600/30 border-indigo-400' : isAlive ? 'bg-slate-900 border-slate-700' : 'bg-slate-950/60 border-slate-900 opacity-60'}">
                                                    <div class="flex items-center gap-4 overflow-hidden">
                                                        <span class="font-black text-lg w-8 shrink-0 ${isFirst ? 'text-amber-400' : 'text-slate-500'}">${index + 1}</span>
                                                        <span class="font-bold text-base truncate ${isAlive ? 'text-white' : 'text-slate-400'}">${p.name}</span>
                                                    </div>
                                                    <div class="text-right shrink-0">
                                                        ${isAlive ? `<span class="font-black text-sm px-3 py-1.5 rounded-xl border bg-emerald-500/10 text-emerald-400 border-emerald-500/20">HP ${p.hp}</span>` : `<span class="text-slate-500 font-bold text-xs px-3 py-1.5 bg-slate-800/40 rounded-xl border border-slate-800/50">T${p.turn}脱落</span>`}
                                                    </div>
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>
                                </div>

                                <div class="flex flex-col gap-4 h-full">
                                    <div class="bg-slate-950 border border-slate-800/60 rounded-3xl p-4 flex flex-col justify-center gap-2">
                                        <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1 px-1">結果を出力する</label>
                                        <div class="grid grid-cols-2 gap-2">
                                            <button id="btn-copy-ranking" class="p-3 bg-slate-900 border border-slate-800 hover:border-indigo-500/50 rounded-xl font-bold text-xs flex items-center justify-center gap-2 transition-all">
                                                📋 通常テキスト
                                            </button>
                                            <button id="btn-copy-discord" class="p-3 bg-slate-900 border border-slate-800 hover:border-indigo-500/50 rounded-xl font-bold text-xs flex items-center justify-center gap-2 transition-all">
                                                📋 Discord形式
                                            </button>
                                            <button id="btn-copy-logs" class="p-3 bg-slate-900 border border-slate-800 hover:border-indigo-500/50 rounded-xl font-bold text-xs flex items-center justify-center gap-2 transition-all col-span-2">
                                                📜 ログをコピー
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="flex gap-4 mt-2">
                                <button id="btn-home" class="w-full py-4 bg-slate-800 hover:bg-slate-700 text-white font-black text-lg rounded-2xl border border-slate-700 transition-all flex items-center justify-center gap-2">
                                    🔄 ホームに戻る
                                </button>
                                <button id="btn-retry" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-black text-lg rounded-2xl shadow-xl transition-all flex items-center justify-center gap-2">
                                    ▶️ もう一度遊ぶ
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            getNextEvent() {
                const nextRevive = this.state.reviveEvents.filter(r => r.turn >= this.state.turn).sort((a, b) => a.turn - b.turn)[0];
                const nextHeal = Math.ceil(this.state.turn / this.state.healInterval) * this.state.healInterval;
                const list = [];
                if (nextRevive) list.push({ name: `${nextRevive.turn}T:復活`, val: nextRevive.turn });
                if (nextHeal > this.state.turn) list.push({ name: `${nextHeal}T:回復`, val: nextHeal });
                if (list.length === 0) return { name: "最終決戦", remaining: "-" };
                const nearest = list.sort((a, b) => a.val - b.val)[0];
                return { name: nearest.name, remaining: nearest.val - this.state.turn };
            }

            getCombinedRanking() {
                const alive = this.state.players.filter(p => p.status === 'alive').sort((a, b) => b.hp - a.hp);
                const dead = [...this.state.eliminated].reverse().map(e => {
                    const p = this.state.players.find(player => player.name === e.name);
                    return { ...p, status: 'dead', turn: e.turn };
                });
                return [...alive, ...dead];
            }

            generateAmount() {
                const r = Math.random() * 100;
                let currentProb = this.state.config.rangeProb;
                if (r < currentProb) {
                    return Math.floor(Math.random() * (this.state.config.rangeMax - this.state.config.rangeMin + 1)) + this.state.config.rangeMin;
                }
                for (const item of this.state.config.fixedItems) {
                    currentProb += item.prob;
                    if (r < currentProb) return item.value;
                }
                return this.state.config.rangeMax;
            }

            getPlayerWeights(alivePlayers) {
                if (!this.state.isHpBalanceEnabled) {
                    return alivePlayers.map(p => ({ ...p, weight: 1 }));
                }
                const totalHp = alivePlayers.reduce((sum, p) => sum + p.hp, 0);
                const avgHp = totalHp / alivePlayers.length;
                return alivePlayers.map(p => ({ ...p, weight: p.hp / avgHp }));
            }

            selectWeightedPlayer(weightedPlayers) {
                const totalWeight = weightedPlayers.reduce((sum, p) => sum + p.weight, 0);
                let r = Math.random() * totalWeight;
                for (const p of weightedPlayers) {
                    r -= p.weight;
                    if (r <= 0) return p;
                }
                return weightedPlayers[weightedPlayers.length - 1];
            }

            startGame() {
                const names = this.state.playerListText.split('\n').map(n => n.trim()).filter(n => n !== '');
                const uniqueNames = [...new Set(names)];
                
                if (uniqueNames.length < 2) {
                    alert('2人以上のプレイヤーが必要です');
                    return;
                }

                const colors = ['text-red-400', 'text-blue-400', 'text-emerald-400', 'text-amber-400', 'text-purple-400', 'text-cyan-400'];
                const initialPlayers = uniqueNames.map((name, index) => ({
                    id: `p-${Date.now()}-${index}`,
                    name: name,
                    hp: this.state.initialHP,
                    status: 'alive',
                    team: this.state.mode === 'team' ? (this.state.teamNames[index % this.state.teamCount] || `チーム${String.fromCharCode(65 + index % this.state.teamCount)}`) : null,
                    teamIndex: this.state.mode === 'team' ? (index % this.state.teamCount) : 0
                }));

                this.state.players = initialPlayers;
                this.state.phase = 'playing';
                this.state.turn = 1;
                this.state.eliminated = [];
                this.state.logs = [];
                this.state.lastResult = null;
                this.state.selectedPlayerIds = [];
                this.state.isManualSelectionPhase = false;
                this.render();
            }

            spinRoulette() {
                if (this.state.isSpinning) return;

                const alivePlayers = this.state.players.filter(p => p.status === 'alive');
                if (alivePlayers.length === 0) {
                    this.state.phase = 'result';
                    this.render();
                    return;
                }

                this.state.isSpinning = true;
                this.render();

                let spins = 0;
                const intervalMs = 60;
                const maxSpins = Math.max(10, Math.floor((this.state.spinDuration * 1000) / intervalMs));

                const weightedPlayers = this.getPlayerWeights(alivePlayers);
                const effectType = 'damage';

                const spinInterval = setInterval(() => {
                    const randomAlive = this.selectWeightedPlayer(weightedPlayers);
                    this.state.displayResult = { player: randomAlive.name, amount: this.generateAmount() };
                    this.render();

                    spins++;
                    if (spins >= maxSpins) {
                        clearInterval(spinInterval);
                        this.finalizeSpin(alivePlayers, effectType);
                    }
                }, intervalMs);
            }

            finalizeSpin(alivePlayers, effectType) {
                const weightedPlayers = this.getPlayerWeights(alivePlayers);
                const chosenPlayer = this.selectWeightedPlayer(weightedPlayers);
                const finalAmount = this.generateAmount();

                let updatedPlayers = this.state.players.map(p => {
                    if (p.id === chosenPlayer.id) {
                        return { ...p, hp: Math.max(0, p.hp - finalAmount) };
                    }
                    return p;
                });

                const newlyDead = [];
                updatedPlayers = updatedPlayers.map(p => {
                    if (p.status === 'alive' && p.hp <= 0) {
                        newlyDead.push({ name: p.name, turn: this.state.turn });
                        return { ...p, hp: 0, status: 'dead' };
                    }
                    return p;
                });

                this.state.players = updatedPlayers;
                if (newlyDead.length > 0) {
                    this.state.eliminated = [...this.state.eliminated, ...newlyDead];
                }

                const turnLog = {
                    id: Date.now(),
                    turn: this.state.turn,
                    type: 'damage',
                    message: `${chosenPlayer.name}に${finalAmount}ダメージ`
                };
                this.state.logs = [turnLog, ...this.state.logs];
                this.state.lastResult = { player: chosenPlayer.name, amount: finalAmount, type: effectType };

                setTimeout(() => {
                    this.state.isSpinning = false;
                    const alivePlayersAfter = this.state.players.filter(p => p.status === 'alive');
                    if (alivePlayersAfter.length <= 1) {
                        this.state.phase = 'result';
                    } else {
                        this.state.turn += 1;
                    }
                    this.render();
                }, 2000);
            }

            copyToClipboard(text) {
                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    alert('コピーしました！');
                } catch (err) {
                    console.error('Copy failed:', err);
                }
                document.body.removeChild(textArea);
            }

            attachEventListeners() {
                // ホーム画面
                const btnSingle = document.getElementById('btn-single');
                if (btnSingle) btnSingle.addEventListener('click', () => {
                    this.state.phase = 'setup';
                    this.render();
                });

                // セットアップ画面
                const inputTitle = document.getElementById('input-title');
                if (inputTitle) inputTitle.addEventListener('change', (e) => {
                    this.state.title = e.target.value;
                });

                const modeButtons = document.querySelectorAll('.mode-btn');
                modeButtons.forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.state.mode = btn.getAttribute('data-mode');
                        this.render();
                    });
                });

                const inputHp = document.getElementById('input-hp');
                if (inputHp) inputHp.addEventListener('change', (e) => {
                    this.state.initialHP = parseInt(e.target.value) || 1000;
                });

                const inputSpeed = document.getElementById('input-speed');
                if (inputSpeed) inputSpeed.addEventListener('change', (e) => {
                    this.state.spinDuration = parseFloat(e.target.value) || 1.5;
                });

                const inputPlayers = document.getElementById('input-players');
                if (inputPlayers) inputPlayers.addEventListener('change', (e) => {
                    this.state.playerListText = e.target.value;
                });

                const btnHpBalance = document.getElementById('btn-hp-balance');
                if (btnHpBalance) btnHpBalance.addEventListener('click', () => {
                    this.state.isHpBalanceEnabled = !this.state.isHpBalanceEnabled;
                    this.render();
                });

                const btnStart = document.getElementById('btn-start');
                if (btnStart && !btnStart.disabled) {
                    btnStart.addEventListener('click', () => this.startGame());
                }

                const btnBack = document.getElementById('btn-back');
                if (btnBack) btnBack.addEventListener('click', () => {
                    this.state.phase = 'home';
                    this.render();
                });

                // プレイング画面
                const btnSpin = document.getElementById('btn-spin');
                if (btnSpin) btnSpin.addEventListener('click', () => this.spinRoulette());

                const playerCards = document.querySelectorAll('.player-card');
                playerCards.forEach(card => {
                    if (this.state.isManualSelectionPhase) {
                        card.addEventListener('click', () => {
                            const playerId = card.getAttribute('data-player-id');
                            const idx = this.state.selectedPlayerIds.indexOf(playerId);
                            if (idx > -1) {
                                this.state.selectedPlayerIds.splice(idx, 1);
                            } else {
                                this.state.selectedPlayerIds.push(playerId);
                            }
                            this.render();
                        });
                    }
                });

                // リザルト画面
                const btnHome = document.getElementById('btn-home');
                if (btnHome) btnHome.addEventListener('click', () => {
                    this.state.phase = 'home';
                    this.state.players = [];
                    this.state.eliminated = [];
                    this.state.logs = [];
                    this.render();
                });

                const btnRetry = document.getElementById('btn-retry');
                if (btnRetry) btnRetry.addEventListener('click', () => {
                    this.state.phase = 'playing';
                    this.state.turn = 1;
                    this.render();
                });

                const btnCopyRanking = document.getElementById('btn-copy-ranking');
                if (btnCopyRanking) {
                    btnCopyRanking.addEventListener('click', () => {
                        const ranking = this.getCombinedRanking();
                        const rankingText = ranking.map((p, i) => 
                            `${i + 1}位:${p.name}${p.status === 'alive' ? `［ライフ${p.hp}で生存］` : `［第${p.turn}ターンで脱���］`}`
                        ).join('\n');
                        this.copyToClipboard(rankingText);
                    });
                }

                const btnCopyDiscord = document.getElementById('btn-copy-discord');
                if (btnCopyDiscord) {
                    btnCopyDiscord.addEventListener('click', () => {
                        const ranking = this.getCombinedRanking();
                        const rankingText = ranking.map((p, i) => 
                            `> ${i + 1}位:${p.name}${p.status === 'alive' ? `［ライフ${p.hp}で生存］` : `［第${p.turn}ターンで脱落］`}`
                        ).join('\n');
                        this.copyToClipboard(rankingText);
                    });
                }

                const btnCopyLogs = document.getElementById('btn-copy-logs');
                if (btnCopyLogs) {
                    btnCopyLogs.addEventListener('click', () => {
                        const text = this.state.logs.map(l => `T${l.turn}: ${l.message}`).join('\n');
                        this.copyToClipboard(text);
                    });
                }
            }
        }

        // アプリケーション開始
        const app = new SurvivalRoulette();
        app.render();
    </script>
</body>
</html>
