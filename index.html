<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Roulette - 生存ルーレット</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
            border: 2px solid transparent;
            background-clip: padding-box;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        [draggable="true"] {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .animate-out {
            animation: fadeOut 1s ease-out forwards;
        }
        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(-20px);
            }
        }
    </style>
</head>
<body class="bg-slate-950">
    <div id="root"></div>

    <script type="module">
        const { useState, useEffect, useRef } = React;

        // Firebase初期化（オフラインモード対応）
        let app, auth, db;
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
        const hasFirebaseConfig = firebaseConfig && firebaseConfig.apiKey;

        if (hasFirebaseConfig) {
            try {
                app = firebase.initializeApp(firebaseConfig);
                auth = firebase.getAuth(app);
                db = firebase.getFirestore(app);
            } catch (e) {
                console.error("Firebase initialization failed:", e);
            }
        }

        const ALL_NUMBER_FORMATS = [
            { id: 'roman', label: 'ローマ数字' }, { id: 'greek', label: 'ギリシャ数字' }, { id: 'kanji', label: '漢数字' }, { id: 'daiji', label: '大字' },
            { id: 'indic', label: 'インド数字' }, { id: 'thai', label: 'タイ数字' }, { id: 'arabic', label: 'アラビア文字数字' }, { id: 'fullwidth', label: '全角数字' },
            { id: 'circled', label: '丸数字' }, { id: 'babylonian', label: 'バビロニア数字' }, { id: 'mayan', label: 'マヤ数字' }, { id: 'egyptian', label: 'エジプト数字' },
        ];

        const ALL_LANGUAGES = [
            "アラビア語", "イタリア語", "インドネシア語", "ウクライナ語", "オランダ語", 
            "スペイン語(スペイン)", "タイ語", "ドイツ語", "トルコ語", "ヒンディー語", 
            "フランス語", "ベトナム語", "ポーランド語", "ポルトガル語(ブラジル)", "ロシア語"
        ];

        const App = () => {
            const [user, setUser] = useState(null);
            const [phase, setPhase] = useState('home');
            const [isMultiplayer, setIsMultiplayer] = useState(false);
            const [currentRoomId, setCurrentRoomId] = useState(null);
            const [roomHostId, setRoomHostId] = useState(null);
            const [joinRoomIdInput, setJoinRoomIdInput] = useState('');
            const [playerNameInput, setPlayerNameInput] = useState('');
            const [joinError, setJoinError] = useState('');

            const [title, setTitle] = useState('');
            const [mode, setMode] = useState('individual');
            const [teamCount, setTeamCount] = useState(2);
            const [teamNames, setTeamNames] = useState(['チームA', 'チームB', 'チームC', 'チームD', 'チームE', 'チームF']);
            const [playerListText, setPlayerListText] = useState("");
            const [players, setPlayers] = useState([]);
            const [eliminated, setEliminated] = useState([]);
            const [turn, setTurn] = useState(1);
            const [isSpinning, setIsSpinning] = useState(false);
            const [displayResult, setDisplayResult] = useState({ player: '？？？', amount: '？' });
            const [lastResult, setLastResult] = useState(null);
            const [logs, setLogs] = useState([]);
            const [initialHP, setInitialHP] = useState(1000);
            const [spinDuration, setSpinDuration] = useState(1.5);
            const [healInterval, setHealInterval] = useState(10);

            const [isManualModeEnabled, setIsManualModeEnabled] = useState(false);
            const [isSpecialEventEnabled, setIsSpecialEventEnabled] = useState(false);
            const [specialEventProb, setSpecialEventProb] = useState(10);
            const [enabledSpecialEvents, setEnabledSpecialEvents] = useState(['reverseMode', 'multiMode']);
            const [isHpBalanceEnabled, setIsHpBalanceEnabled] = useState(false);

            const [numberFormat, setNumberFormat] = useState('default');
            const [diceConfig, setDiceConfig] = useState({ min: 1, max: 100 });
            const [enabledFormats, setEnabledFormats] = useState(ALL_NUMBER_FORMATS.map(f => f.id));
            const [enabledLangs, setEnabledLangs] = useState(ALL_LANGUAGES);

            const [manualPlayers, setManualPlayers] = useState([]);
            const [selectedPlayerIds, setSelectedPlayerIds] = useState([]);
            const [isManualSelectionPhase, setIsManualSelectionPhase] = useState(false);

            const [config, setConfig] = useState({
                rangeMin: 1, rangeMax: 20, rangeProb: 70,
                fixedItems: [{ id: 1, value: 50, prob: 20 }, { id: 2, value: 100, prob: 10 }]
            });

            const [reviveEvents, setReviveEvents] = useState([
                { id: 1, turn: 50, type: 'steal' }, { id: 2, turn: 100, type: 'copy' }
            ]);

            const [draggedPlayer, setDraggedPlayer] = useState(null);
            const [touchTargetTeam, setTouchTargetTeam] = useState(null);

            useEffect(() => {
                // オフラインモードでのゲスト認証
                if (!hasFirebaseConfig || !auth) {
                    setUser({ uid: 'local-' + Math.random().toString(36).substr(2, 9), isLocal: true });
                } else {
                    try {
                        firebase.auth().signInAnonymously().then(result => {
                            setUser(result.user);
                        }).catch(err => {
                            console.error("Auth failed:", err);
                            setUser({ uid: 'local-' + Math.random().toString(36).substr(2, 9), isLocal: true });
                        });
                    } catch (err) {
                        setUser({ uid: 'local-' + Math.random().toString(36).substr(2, 9), isLocal: true });
                    }
                }
            }, []);

            useEffect(() => {
                if (!isMultiplayer) {
                    const names = playerListText.split('\n').map(n => n.trim()).filter(n => n !== '');
                    const uniqueNames = [...new Set(names)];
                    setManualPlayers(prev => uniqueNames.map((name, index) => {
                        const existing = prev.find(p => p.name === name);
                        if (existing) return existing;
                        return { name, teamIndex: mode === 'team' ? (index % teamCount) : 0 };
                    }));
                }
            }, [playerListText, teamCount, mode, isMultiplayer]);

            const totalProb = (parseInt(config.rangeProb) || 0) + config.fixedItems.reduce((sum, item) => sum + (parseInt(item.prob) || 0), 0);
            const isHost = isMultiplayer ? (user?.uid === roomHostId) : true;

            const convertNumber = (num, format) => {
                if (typeof num !== 'number' || format === 'default') return num;
                switch (format) {
                    case 'roman': {
                        const roman = {M:1000,CM:900,D:500,CD:400,C:100,XC:90,L:50,XL:40,X:10,IX:9,V:5,IV:4,I:1};
                        let res = '', n = num;
                        for (let i in roman) { while (n >= roman[i]) { res += i; n -= roman[i]; } }
                        return res || '0';
                    }
                    case 'kanji': return num.toString().split('').map(d => ['零','一','二','三','四','五','六','七','八','九'][parseInt(d)]).join('');
                    case 'daiji': return num.toString().split('').map(d => ['零','壱','弐','参','肆','伍','陸','漆','捌','玖'][parseInt(d)]).join('');
                    case 'fullwidth': return num.toString().split('').map(d => ['０','１','２','３','４','５','６','７','８','９'][parseInt(d)]).join('');
                    default: return num;
                }
            };

            const generateAmount = () => {
                const r = Math.random() * 100;
                let currentProb = config.rangeProb;
                if (r < currentProb) return Math.floor(Math.random() * (config.rangeMax - config.rangeMin + 1)) + config.rangeMin;
                for (const item of config.fixedItems) {
                    currentProb += item.prob;
                    if (r < currentProb) return item.value;
                }
                return config.rangeMax;
            };

            const copyToClipboard = (text) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    alert('コピーしました！');
                } catch (err) {}
                document.body.removeChild(textArea);
            };

            const getCombinedRanking = () => {
                const alive = players.filter(p => p.status === 'alive').sort((a, b) => b.hp - a.hp);
                const dead = [...eliminated].reverse().map(e => {
                    const p = players.find(player => player.name === e.name);
                    return { ...p, status: 'dead', turn: e.turn };
                });
                return [...alive, ...dead];
            };

            const handleCreateRoom = () => {
                if (!user) return;
                const roomId = Math.random().toString(36).substring(2, 7).toUpperCase();
                setCurrentRoomId(roomId);
                setRoomHostId(user.uid);
                alert(`ルームIDが生成されました: ${roomId}\nこのIDを他のプレイヤーに共有してください`);
                setPhase('multi_name');
            };

            const handleJoinRoom = () => {
                if (!joinRoomIdInput.trim()) {
                    setJoinError('ルームIDを入力してください');
                    return;
                }
                setCurrentRoomId(joinRoomIdInput.toUpperCase());
                setJoinError('');
                setPhase('multi_name');
            };

            const handlePlayerJoin = () => {
                if (!playerNameInput.trim()) {
                    alert('プレイヤー名を入力してください');
                    return;
                }
                // シンプルなメモリ内ルーム管理
                if (!window.rooms) window.rooms = {};
                if (!window.rooms[currentRoomId]) {
                    window.rooms[currentRoomId] = {
                        hostId: roomHostId,
                        status: 'joining',
                        players: [],
                        settings: { title, mode, teamCount, teamNames, initialHP, spinDuration, healInterval, isHpBalanceEnabled, isSpecialEventEnabled, specialEventProb, enabledSpecialEvents, diceConfig, enabledFormats, enabledLangs, config, reviveEvents }
                    };
                }
                window.rooms[currentRoomId].players.push({
                    id: `p-${Date.now()}-${user.uid}`,
                    uid: user.uid,
                    name: playerNameInput.trim(),
                    hp: initialHP,
                    status: 'alive',
                    teamIndex: 0
                });
                setPlayerNameInput('');
                setPhase('multi_lobby');
            };

            const startGameMultiplayer = () => {
                if (!window.rooms[currentRoomId]) return;
                const colors = ['text-red-400', 'text-blue-400', 'text-emerald-400', 'text-amber-400', 'text-purple-400', 'text-cyan-400'];
                const roomData = window.rooms[currentRoomId];
                const updatedPlayers = roomData.players.map(p => ({
                    ...p,
                    teamColor: mode === 'team' ? colors[p.teamIndex % colors.length] : null
                }));
                window.rooms[currentRoomId].status = 'playing';
                window.rooms[currentRoomId].gameState = { turn: 1, logs: [], eliminated: [], isSpinning: false, displayResult: { player: '？？？', amount: '？' }, lastResult: null };
                setPlayers(updatedPlayers);
                setPhase('playing');
                setTurn(1);
                setEliminated([]);
                setLogs([]);
            };

            const startGameSingle = () => {
                if (totalProb !== 100 || manualPlayers.length < 2) return;
                const colors = ['text-red-400', 'text-blue-400', 'text-emerald-400', 'text-amber-400', 'text-purple-400', 'text-cyan-400'];
                const initialPlayers = manualPlayers.map((p, index) => {
                    const team = mode === 'team' ? (teamNames[p.teamIndex] || `チーム${String.fromCharCode(65 + p.teamIndex)}`) : null;
                    const teamColor = mode === 'team' ? colors[p.teamIndex % colors.length] : null;
                    return { id: `p-${Date.now()}-${index}`, name: p.name, hp: initialHP, status: 'alive', team: team, teamColor: teamColor, teamIndex: p.teamIndex };
                });
                setPlayers(initialPlayers);
                setPhase('playing');
                setTurn(1);
                setEliminated([]);
                setLogs([]);
                setLastResult(null);
                setIsManualSelectionPhase(false);
                setSelectedPlayerIds([]);
            };

            const getPlayerWeights = (alivePlayers) => {
                if (!isHpBalanceEnabled) return alivePlayers.map(p => ({ ...p, weight: 1 }));
                const totalHp = alivePlayers.reduce((sum, p) => sum + p.hp, 0);
                const avgHp = totalHp / alivePlayers.length;
                return alivePlayers.map(p => ({ ...p, weight: p.hp / avgHp }));
            };

            const selectWeightedPlayer = (weightedPlayers) => {
                const totalWeight = weightedPlayers.reduce((sum, p) => sum + p.weight, 0);
                let r = Math.random() * totalWeight;
                for (const p of weightedPlayers) {
                    r -= p.weight;
                    if (r <= 0) return p;
                }
                return weightedPlayers[weightedPlayers.length - 1];
            };

            const togglePlayerSelection = (playerId) => {
                setSelectedPlayerIds(prev =>
                    prev.includes(playerId) ? prev.filter(id => id !== playerId) : [...prev, playerId]
                );
            };

            const spinRoulette = async () => {
                if (isSpinning) return;

                const alivePlayers = players.filter(p => p.status === 'alive');
                if (alivePlayers.length === 0) {
                    setPhase('result');
                    return;
                }

                setIsSpinning(true);
                let spins = 0;
                const intervalMs = 60;
                const maxSpins = Math.max(10, Math.floor((spinDuration * 1000) / intervalMs));

                const weightedPlayers = getPlayerWeights(alivePlayers);
                const effectType = 'damage';

                const spinInterval = setInterval(() => {
                    const randomAlive = selectWeightedPlayer(weightedPlayers);
                    setDisplayResult({ player: randomAlive.name, amount: convertNumber(generateAmount(), numberFormat) });
                    spins++;
                    if (spins >= maxSpins) {
                        clearInterval(spinInterval);
                        finalizeSpin(alivePlayers, effectType);
                    }
                }, intervalMs);
            };

            const finalizeSpin = (alivePlayers, effectType) => {
                const weightedPlayers = getPlayerWeights(alivePlayers);
                const chosenPlayer = selectWeightedPlayer(weightedPlayers);
                const finalAmount = generateAmount();

                let updatedPlayers = players.map(p => {
                    if (p.id === chosenPlayer.id) {
                        return { ...p, hp: Math.max(0, p.hp - finalAmount) };
                    }
                    return p;
                });

                const newlyDead = [];
                updatedPlayers = updatedPlayers.map(p => {
                    if (p.status === 'alive' && p.hp <= 0) {
                        newlyDead.push({ name: p.name, turn: turn });
                        return { ...p, hp: 0, status: 'dead' };
                    }
                    return p;
                });

                setPlayers(updatedPlayers);
                if (newlyDead.length > 0) {
                    setEliminated(prev => [...prev, ...newlyDead]);
                }

                const turnLog = {
                    id: Date.now(),
                    turn: turn,
                    type: 'damage',
                    message: `${chosenPlayer.name}に${finalAmount}ダメージ`
                };
                setLogs(prev => [turnLog, ...prev]);
                setLastResult({ player: chosenPlayer.name, amount: finalAmount, type: effectType });

                setTimeout(() => {
                    setIsSpinning(false);
                    const alivePlayersAfter = updatedPlayers.filter(p => p.status === 'alive');
                    if (alivePlayersAfter.length <= 1) {
                        setPhase('result');
                    } else {
                        setTurn(turn + 1);
                    }
                }, 2000);
            };

            const backToHome = () => {
                setPhase('home');
                setIsMultiplayer(false);
                setCurrentRoomId(null);
                setRoomHostId(null);
                setPlayers([]);
                setEliminated([]);
                setLogs([]);
                setTurn(1);
                setDisplayResult({ player: '？？？', amount: '？' });
                setLastResult(null);
            };

            const RankingList = ({ ranking }) => (
                <div className="space-y-2 overflow-y-auto flex-1 pr-1 custom-scrollbar">
                    {ranking.map((p, index) => {
                        const isAlive = p.status === 'alive';
                        const isFirst = index === 0 && isAlive;
                        const isLowHp = isAlive && p.hp <= initialHP * 0.3;
                        return (
                            <div key={index} className={`flex items-center justify-between p-4 rounded-2xl border transition-all ${isFirst ? 'bg-indigo-600/30 border-indigo-400' : isAlive ? (isLowHp ? 'bg-red-950/20 border-red-800' : 'bg-slate-900 border-slate-700') : 'bg-slate-950/60 border-slate-900 opacity-60'}`}>
                                <div className="flex items-center gap-4 overflow-hidden">
                                    <span className={`font-black text-lg w-8 shrink-0 ${isFirst ? 'text-amber-400' : 'text-slate-500'}`}>{index + 1}</span>
                                    <span className={`font-bold text-base truncate ${isAlive ? 'text-white' : 'text-slate-400'}`}>{p.name}</span>
                                </div>
                                <div className="text-right shrink-0">
                                    {isAlive ? <span className={`font-black text-sm px-3 py-1.5 rounded-xl border tabular-nums ${isLowHp ? 'bg-red-500/20 text-red-500 border-red-500/30' : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20'}`}>HP {p.hp}</span> : <span className="text-slate-500 font-bold text-xs px-3 py-1.5 bg-slate-800/40 rounded-xl border border-slate-800/50">T{p.turn}脱落</span>}
                                </div>
                            </div>
                        );
                    })}
                </div>
            );

            if (phase === 'home') {
                return (
                    <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-6 relative overflow-hidden">
                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-indigo-600/20 rounded-full blur-[120px] pointer-events-none"></div>
                        <div className="z-10 text-center max-w-xl w-full">
                            <div className="mb-4 inline-block p-4 bg-indigo-900/50 rounded-3xl border border-indigo-500/30">⚔️</div>
                            <h1 className="text-5xl md:text-7xl font-black italic tracking-tighter text-white drop-shadow-2xl mb-12 uppercase leading-none">Survival<br/><span className="text-indigo-400">Roulette</span></h1>
                            <div className="flex flex-col gap-4">
                                <button onClick={() => { setIsMultiplayer(false); setPhase('setup'); }} className="w-full py-5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl font-black text-2xl transition-all shadow-[0_0_30px_rgba(79,70,229,0.4)] flex items-center justify-center gap-3">👥 ひとりで遊ぶ</button>
                                <button onClick={() => { setIsMultiplayer(true); setPhase('multi_menu'); }} className="w-full py-5 bg-slate-900 border-2 border-slate-700 hover:border-indigo-500 hover:bg-slate-800 text-slate-300 hover:text-white rounded-2xl font-black text-2xl transition-all flex items-center justify-center gap-3">⚡ みんなで遊ぶ</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (phase === 'multi_menu') {
                return (
                    <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-6">
                        <div className="w-full max-w-md bg-slate-900 rounded-[2.5rem] border border-slate-800 p-8 shadow-2xl flex flex-col items-center text-center">
                            <h2 className="text-3xl font-black italic tracking-tighter text-indigo-400 mb-8 uppercase">Multiplayer</h2>
                            <div className="flex flex-col gap-4 w-full">
                                <button onClick={() => { setPhase('setup'); }} className="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-black text-xl transition-all">ルーム作成</button>
                                <button onClick={() => { setPhase('multi_join_id'); }} className="w-full py-4 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-black text-xl transition-all">ID入室</button>
                            </div>
                            <button onClick={() => setPhase('home')} className="mt-8 text-slate-500 font-bold hover:text-white transition-colors">← 戻る</button>
                        </div>
                    </div>
                );
            }

            if (phase === 'multi_join_id') {
                return (
                    <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-6">
                        <div className="w-full max-w-md bg-slate-900 rounded-[2.5rem] border border-slate-800 p-8 shadow-2xl text-center">
                            <h2 className="text-2xl font-black italic tracking-tighter text-white mb-2 uppercase">JOIN ROOM</h2>
                            <p className="text-slate-400 text-xs font-bold mb-6">共有されたルームIDを入力してください</p>
                            <input type="text" value={joinRoomIdInput} onChange={(e) => setJoinRoomIdInput(e.target.value)} placeholder="ROOM ID" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-4 font-black text-2xl mb-2 outline-none focus:border-indigo-500 text-center uppercase tracking-widest text-indigo-400" maxLength={6}/>
                            {joinError && <div className="text-red-500 text-xs font-bold mb-4">{joinError}</div>}
                            <button onClick={handleJoinRoom} disabled={!joinRoomIdInput.trim()} className={`w-full mt-4 py-4 rounded-xl font-black text-xl transition-all ${joinRoomIdInput.trim() ? 'bg-indigo-600 hover:bg-indigo-500 text-white' : 'bg-slate-800 text-slate-500'}`}>次へ</button>
                            <button onClick={() => setPhase('multi_menu')} className="mt-6 text-slate-500 font-bold hover:text-white transition-colors">キャンセル</button>
                        </div>
                    </div>
                );
            }

            if (phase === 'multi_name') {
                return (
                    <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-6">
                        <div className="w-full max-w-md bg-slate-900 rounded-[2.5rem] border border-slate-800 p-8 shadow-2xl text-center">
                            <h2 className="text-2xl font-black italic tracking-tighter text-white mb-2 uppercase">YOUR NAME</h2>
                            <p className="text-slate-400 text-xs font-bold mb-6">ゲーム内で表示される名前を入力してください</p>
                            <input type="text" value={playerNameInput} onChange={(e) => setPlayerNameInput(e.target.value)} placeholder="Player Name" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-4 font-bold text-lg mb-6 outline-none focus:border-indigo-500 text-center text-white" maxLength={15}/>
                            <button onClick={handlePlayerJoin} disabled={!playerNameInput.trim()} className={`w-full py-4 rounded-xl font-black text-xl transition-all ${playerNameInput.trim() ? 'bg-indigo-600 hover:bg-indigo-500 text-white' : 'bg-slate-800 text-slate-500'}`}>入室する</button>
                        </div>
                    </div>
                );
            }

            if (phase === 'multi_lobby') {
                const roomData = window.rooms?.[currentRoomId];
                const roomPlayers = roomData?.players || [];
                return (
                    <div className="min-h-screen bg-slate-950 text-slate-100 p-4 md:p-6 flex flex-col items-center justify-center">
                        <div className="bg-slate-900 rounded-[3rem] shadow-2xl border border-slate-800 w-full max-w-4xl p-6 md:p-10 flex flex-col h-[85vh]">
                            <div className="text-center mb-6 shrink-0 relative">
                                <div className="absolute top-0 left-0 bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 px-3 py-1.5 rounded-xl text-[10px] font-black uppercase tracking-widest flex items-center gap-1">⚡ MULTIPLAYER</div>
                                <h2 className="text-4xl font-black italic tracking-tighter text-white mt-4 md:mt-0 mb-4 uppercase">WAITING LOBBY</h2>
                                <div className="inline-flex items-center gap-4 bg-slate-950 border border-slate-800 px-6 py-3 rounded-2xl mx-auto">
                                    <span className="text-slate-500 font-black text-xs uppercase tracking-widest">Room ID</span>
                                    <span className="text-3xl font-black text-indigo-400 tracking-widest">{currentRoomId}</span>
                                    <button onClick={() => copyToClipboard(currentRoomId)} className="p-2.5 bg-slate-800 rounded-xl hover:bg-slate-700 transition-colors">📋</button>
                                </div>
                            </div>
                            
                            <div className="text-[10px] font-black text-slate-500 tracking-widest uppercase mb-3 flex justify-between items-end">
                                <span className="flex items-center gap-2">👥 Participants ({roomPlayers.length})</span>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto custom-scrollbar border border-slate-800 rounded-3xl p-4 bg-slate-950 mb-6">
                                <div className="flex flex-wrap gap-3">
                                    {roomPlayers.map((p) => (
                                        <div key={p.id} className={`px-5 py-3 rounded-xl border font-bold text-sm flex items-center gap-3 ${p.uid === roomHostId ? 'bg-indigo-900/30 border-indigo-500/50 text-indigo-100' : 'bg-slate-900 border-slate-800 text-slate-200'}`}>
                                            {p.uid === roomHostId ? '🏆' : '👤'} {p.name}
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="shrink-0 text-center">
                                {isHost ? (
                                    <button onClick={startGameMultiplayer} disabled={roomPlayers.length < 2} className={`w-full max-w-md mx-auto py-5 rounded-2xl font-black text-2xl transition-all shadow-2xl flex items-center justify-center gap-3 ${roomPlayers.length >= 2 ? 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-indigo-500/30' : 'bg-slate-800 text-slate-600 border border-slate-700'}`}>
                                        {roomPlayers.length >= 2 ? <>▶️ ゲームスタート</> : '参加者を待っています...'}
                                    </button>
                                ) : (
                                    <div className="bg-slate-800 border border-slate-700 w-full max-w-md mx-auto py-5 rounded-2xl font-black text-lg text-slate-400 flex items-center justify-center gap-3 animate-pulse">
                                        🕐 ホストの開始を待機中...
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            if (phase === 'setup') {
                return (
                    <div className="min-h-screen bg-slate-950 text-slate-100 p-4 md:p-6 flex items-center justify-center">
                        <div className="w-full max-w-5xl bg-slate-900 rounded-[2.5rem] shadow-2xl border border-slate-800 overflow-hidden">
                            <div className="bg-gradient-to-br from-indigo-600 to-indigo-800 p-6 text-center">
                                <h1 className="text-2xl md:text-3xl font-black italic tracking-tighter text-white drop-shadow-lg uppercase">SURVIVAL ROULETTE</h1>
                            </div>
                            
                            <div className="p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 overflow-y-auto custom-scrollbar max-h-[80vh]">
                                <div className="space-y-4">
                                    <label className="text-[10px] font-black text-slate-500 tracking-widest uppercase">⚙️ 基本設定</label>
                                    <div className="p-3 bg-slate-950 rounded-2xl border border-slate-800 space-y-2">
                                        <label className="text-[8px] font-black text-slate-500 tracking-widest block uppercase">タイトル</label>
                                        <input type="text" value={title} onChange={(e) => setTitle(e.target.value)} placeholder="ゲームのタイトルを入力..." className="bg-transparent text-sm font-bold w-full outline-none text-white border-b border-slate-800 focus:border-indigo-500 pb-1" />
                                        <div className="flex gap-1 pt-2">
                                            {['individual', 'team'].map(m => (
                                                <button key={m} onClick={() => setMode(m)} className={`px-4 py-1.5 text-[10px] font-black rounded-lg transition-all ${mode === m ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-500 hover:text-slate-300'}`}>{m === 'individual' ? '個人戦' : 'チーム戦'}</button>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="p-3 bg-slate-950 rounded-2xl border border-slate-800"><label className="text-[8px] font-black text-slate-500 block mb-1 uppercase">初期HP</label><input type="number" value={initialHP} onChange={(e) => setInitialHP(Math.max(1, parseInt(e.target.value) || 1))} className="bg-transparent text-lg font-black w-full outline-none text-indigo-400" /></div>
                                        <div className="p-3 bg-slate-950 rounded-2xl border border-slate-800"><label className="text-[8px] font-black text-slate-500 block mb-1 uppercase">速度</label><input type="number" step="0.1" value={spinDuration} onChange={(e) => setSpinDuration(Math.max(0.1, parseFloat(e.target.value) || 0.1))} className="bg-transparent text-lg font-black w-full outline-none text-amber-500" /></div>
                                    </div>
                                </div>

                                <div className="space-y-4">
                                    <label className="text-[10px] font-black text-slate-500 tracking-widest block uppercase">👥 プレイヤーリスト</label>
                                    <textarea value={playerListText} onChange={(e) => setPlayerListText(e.target.value)} placeholder="名前を改行で入力..." className="w-full h-64 bg-slate-950 border border-slate-800 rounded-2xl p-4 outline-none focus:ring-2 focus:ring-indigo-500 font-bold text-sm custom-scrollbar resize-none" />
                                </div>

                                <div className="space-y-4">
                                    <label className="text-[10px] font-black text-slate-500 tracking-widest block uppercase">% ルーレット構成</label>
                                    <div className="p-4 bg-slate-950 rounded-2xl border border-slate-800 space-y-3">
                                        <div className="flex justify-between items-center">
                                            <span className="text-[10px] font-black text-slate-400">ランダム範囲</span>
                                            <div className="flex items-center gap-1"><input type="number" value={config.rangeProb} onChange={(e) => setConfig({...config, rangeProb: e.target.value})} className="bg-transparent text-[10px] font-black w-6 outline-none text-indigo-400 text-right" /><span className="text-[8px]">%</span></div>
                                        </div>
                                        <div className="flex items-center gap-2"><input type="number" value={config.rangeMin} onChange={(e) => setConfig({...config, rangeMin: e.target.value})} className="w-full bg-slate-900 p-2 rounded-xl text-center font-black text-xs border border-slate-800" /><span>~</span><input type="number" value={config.rangeMax} onChange={(e) => setConfig({...config, rangeMax: e.target.value})} className="w-full bg-slate-900 p-2 rounded-xl text-center font-black text-xs border border-slate-800" /></div>
                                    </div>

                                    <button onClick={() => setIsHpBalanceEnabled(!isHpBalanceEnabled)} className={`w-full p-3 rounded-2xl border flex items-center justify-between transition-all ${isHpBalanceEnabled ? 'bg-emerald-600/10 border-emerald-500 text-white' : 'bg-slate-950 border-slate-800 text-slate-500'}`}>
                                        <span className="text-[10px] font-black uppercase">⚖️ HP調整</span>
                                        <div className={`px-2 py-0.5 rounded text-[8px] font-black ${isHpBalanceEnabled ? 'bg-emerald-600' : 'bg-slate-800'}`}>{isHpBalanceEnabled ? 'ON' : 'OFF'}</div>
                                    </button>
                                </div>
                            </div>

                            <div className="flex gap-4 p-6 bg-slate-950 border-t border-slate-800">
                                <button onClick={() => isMultiplayer ? setPhase('multi_menu') : setPhase('home')} className="px-6 py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-black transition-all">戻る</button>
                                <button onClick={isMultiplayer ? handleCreateRoom : startGameSingle} disabled={totalProb !== 100 || (!isMultiplayer && manualPlayers.length < 2)} className={`flex-1 py-4 rounded-2xl font-black text-xl transition-all flex items-center justify-center gap-3 text-white ${totalProb === 100 && (isMultiplayer || manualPlayers.length >= 2) ? 'bg-indigo-600 hover:bg-indigo-500 cursor-pointer' : 'bg-slate-800 text-slate-600 cursor-not-allowed opacity-50'}`}>
                                    ▶️ {isMultiplayer ? 'ルーム作成' : 'ゲーム開始'}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (phase === 'playing') {
                const survivorsSorted = players.filter(p => p.status === 'alive').sort((a, b) => b.hp - a.hp);
                const isHealTurn = turn % healInterval === 0 && !reviveEvents.some(r => r.turn === turn);
                const currentReviveEvent = reviveEvents.find(r => r.turn === turn);
                const isReviveTurn = !!currentReviveEvent;

                return (
                    <div className="min-h-screen bg-slate-950 text-slate-100 p-4 md:p-6 flex flex-col md:flex-row gap-6 max-w-[1500px] mx-auto">
                        <div className="flex-1 flex flex-col gap-6">
                            <div className="bg-slate-900 rounded-3xl p-6 border-b-4 border-indigo-600 flex justify-between items-center">
                                <div className="flex items-center gap-5">
                                    <div className="w-14 h-14 bg-indigo-600 rounded-2xl flex items-center justify-center font-black text-2xl text-white">{turn}</div>
                                    <div><div className="text-indigo-400 font-black text-[11px] tracking-widest uppercase">{title}</div><div className="text-xl font-black italic text-white">{isReviveTurn ? 'SPECIAL EVENT' : isHealTurn ? 'HEALING TIME' : 'BATTLE ROUND'}</div></div>
                                </div>
                            </div>

                            <div className="bg-slate-900 rounded-[3rem] p-8 border border-slate-800 flex flex-col items-center justify-center relative flex-1">
                                <div className="text-center w-full px-6 relative z-10 flex flex-col items-center">
                                    <div className="text-3xl md:text-6xl font-black mb-6 tracking-tighter italic text-white">{displayResult.player}</div>
                                    <div className={`text-[5rem] md:text-[9rem] font-black leading-none tabular-nums break-all ${isSpinning ? 'text-slate-800 scale-95' : 'text-red-600'}`}>{displayResult.amount}</div>
                                </div>
                                
                                <div className="mt-10 w-full max-w-[320px] relative z-10">
                                    <button onClick={spinRoulette} disabled={isSpinning} className={`w-full py-6 rounded-[2rem] font-black text-2xl shadow-2xl transition-all border-b-[10px] flex items-center justify-center gap-4 text-white ${isSpinning ? 'bg-slate-800 border-slate-950' : 'bg-red-600 border-red-900 hover:brightness-110'}`}>
                                        🎡 {isSpinning ? 'SPINNING...' : 'SPIN'}
                                    </button>
                                </div>
                            </div>

                            <div className="bg-slate-900 rounded-3xl p-6 border border-slate-800 flex flex-col overflow-hidden h-[200px]">
                                <div className="text-slate-500 font-black text-[11px] tracking-[0.3em] uppercase mb-4">📜 LOGS</div>
                                <div className="overflow-y-auto flex-1 space-y-2 pr-1 custom-scrollbar">
                                    {logs.slice(0, 20).map((log, i) => (
                                        <div key={log.id} className={`flex items-center gap-4 p-4 rounded-2xl border ${log.type === 'damage' ? 'bg-red-500/5 border-red-500/10' : 'bg-slate-950 border-slate-800/60'}`}>
                                            <div className="w-10 h-10 bg-slate-900 rounded-xl flex items-center justify-center shrink-0 font-black text-[10px] text-slate-500">T{log.turn}</div>
                                            <span className={`text-sm font-bold truncate flex-1 ${log.type === 'death' ? 'text-red-400' : 'text-slate-200'}`}>{log.message}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="md:w-[360px] flex flex-col gap-6">
                            <div className="bg-slate-900 rounded-[2.5rem] p-6 border border-slate-800 flex flex-col">
                                <div className="text-slate-500 font-black text-[11px] mb-5 uppercase flex items-center justify-between px-2">
                                    <span className="flex items-center gap-2 text-white">👥 Survivors</span>
                                    <span className="bg-indigo-600 text-white px-3 py-1 rounded-full text-[11px]">{survivorsSorted.length}</span>
                                </div>
                                <div className="space-y-3 overflow-y-auto flex-1 pr-1 custom-scrollbar max-h-[300px]">
                                    {survivorsSorted.map(p => {
                                        const isLowHp = p.hp <= initialHP * 0.3;
                                        return (
                                            <div key={p.id} className={`bg-slate-950 p-4 rounded-2xl border flex justify-between items-center ${isLowHp ? 'border-red-900 bg-red-950/10' : 'border-slate-800'}`}>
                                                <div className="flex items-center gap-2 truncate pr-2">
                                                    {isLowHp && <span>⚠️</span>}
                                                    <span className="font-bold text-sm truncate">{p.name}</span>
                                                </div>
                                                <span className={`text-lg font-black tabular-nums ${isLowHp ? 'text-red-500' : 'text-emerald-400'}`}>{p.hp}</span>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="bg-slate-900 rounded-[2.5rem] p-6 border border-slate-800 flex flex-col flex-1 overflow-hidden">
                                <div className="text-slate-500 font-black text-[11px] uppercase mb-4">🏆 Ranking</div>
                                <RankingList ranking={getCombinedRanking()} />
                            </div>
                        </div>
                    </div>
                );
            }

            if (phase === 'result') {
                const combinedRanking = getCombinedRanking();
                const alivePlayers = players.filter(p => p.status === 'alive');
                const hasWinner = alivePlayers.length > 0;

                return (
                    <div className="min-h-screen bg-slate-950 text-slate-100 p-4 md:p-8 flex flex-col items-center justify-center max-w-[1000px] mx-auto">
                        <div className="w-full bg-slate-900 border border-slate-800 rounded-[2.5rem] p-6 md:p-10 shadow-2xl flex flex-col gap-6">
                            <div className="text-center">
                                <div className="inline-block p-4 bg-indigo-900/30 rounded-3xl border border-indigo-500/20 mb-3">🏆</div>
                                <h1 className="text-3xl md:text-5xl font-black italic uppercase text-white">RESULT</h1>
                            </div>

                            <div className="bg-slate-950 border border-slate-800/80 rounded-3xl p-6 text-center max-w-lg mx-auto w-full">
                                {hasWinner ? (
                                    <div>
                                        <div className="text-[10px] font-black text-indigo-400 tracking-[0.2em] uppercase mb-1">WINNER</div>
                                        <div className="text-2xl md:text-3xl font-black text-amber-400 mb-1">{alivePlayers[0].name}</div>
                                        <div className="text-slate-400 text-xs font-bold">第{turn}ターンを耐え抜き、勝利を掴み取った！</div>
                                    </div>
                                ) : (
                                    <div className="text-slate-500 font-bold text-lg">勝者なし (全員脱落)</div>
                                )}
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div className="bg-slate-950 border border-slate-800/60 rounded-3xl p-4 flex flex-col h-full overflow-hidden">
                                    <label className="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-3">🏆 最終順位</label>
                                    <RankingList ranking={combinedRanking} />
                                </div>

                                <div className="flex flex-col gap-4">
                                    <div className="bg-slate-950 border border-slate-800/60 rounded-3xl p-4 flex flex-col justify-center gap-2">
                                        <label className="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">結果を出力する</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            <button onClick={() => copyToClipboard(combinedRanking.map((p, i) => `${i + 1}位:${p.name}${p.status === 'alive' ? `（HP${p.hp}）` : `（T${p.turn}脱落）`}`).join('\n'))} className="p-3 bg-slate-900 border border-slate-800 hover:border-indigo-500/50 rounded-xl font-bold text-xs flex items-center justify-center gap-2">📋 通常テキスト</button>
                                            <button onClick={() => copyToClipboard(combinedRanking.map((p, i) => `> ${i + 1}位:${p.name}${p.status === 'alive' ? `（HP${p.hp}）` : `（T${p.turn}脱落）`}`).join('\n'))} className="p-3 bg-slate-900 border border-slate-800 hover:border-indigo-500/50 rounded-xl font-bold text-xs flex items-center justify-center gap-2">📋 Discord形式</button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="flex gap-4">
                                <button onClick={backToHome} className="w-full py-4 bg-slate-800 hover:bg-slate-700 text-white font-black text-lg rounded-2xl border border-slate-700">🔄 ホームに戻る</button>
                                <button onClick={isMultiplayer ? startGameMultiplayer : startGameSingle} className="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-black text-lg rounded-2xl shadow-xl">▶️ もう一度遊ぶ</button>
                            </div>
                        </div>
                    </div>
                );
            }

            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
