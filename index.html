<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Roulette - Game</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: #0f172a;
            color: #e2e8f0;
        }

        #root {
            min-height: 100vh;
        }

        /* スクロールバー */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
            border: 2px solid transparent;
            background-clip: padding-box;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        /* ユーティリティ */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        [draggable="true"] {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* アニメーション */
        @keyframes slideOutToTop {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(-32px);
            }
        }

        .animate-out {
            animation: slideOutToTop 1s ease-out forwards;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .animate-bounce {
            animation: bounce 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .animate-spin {
            animation: spin 1s linear infinite;
        }

        /* Tailwind風のユーティリティクラス */
        .min-h-screen { min-height: 100vh; }
        .h-screen { height: 100vh; }
        .h-full { height: 100%; }
        .w-full { width: 100%; }
        .overflow-hidden { overflow: hidden; }
        .overflow-y-auto { overflow-y: auto; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .flex-row { flex-direction: row; }
        .flex-1 { flex: 1; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .gap-1 { gap: 0.25rem; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }
        .gap-6 { gap: 1.5rem; }
        .p-2 { padding: 0.5rem; }
        .p-3 { padding: 0.75rem; }
        .p-4 { padding: 1rem; }
        .p-6 { padding: 1.5rem; }
        .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .text-center { text-align: center; }
        .rounded { border-radius: 0.25rem; }
        .rounded-lg { border-radius: 0.5rem; }
        .rounded-xl { border-radius: 0.75rem; }
        .rounded-2xl { border-radius: 1rem; }
        .rounded-3xl { border-radius: 1.5rem; }
        .rounded-full { border-radius: 9999px; }
        .border { border: 1px solid; }
        .border-2 { border: 2px solid; }
        .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        .transition { transition-property: all; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
        .transition-all { transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1); }
        .cursor-pointer { cursor: pointer; }
        .cursor-not-allowed { cursor: not-allowed; }
        .disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* レスポンシブ */
        @media (max-width: 768px) {
            .md\:p-6 { padding: 1.5rem; }
            .md\:text-5xl { font-size: 3rem; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Lucide React Icons (簡略版)
        const Icons = {
            Users: (props) => <span>👥</span>,
            Heart: (props) => <span>❤️</span>,
            Skull: (props) => <span>💀</span>,
            History: (props) => <span>📜</span>,
            Swords: (props) => <span>⚔️</span>,
            Trophy: (props) => <span>🏆</span>,
            RotateCcw: (props) => <span>🔄</span>,
            Play: (props) => <span>▶️</span>,
            Sparkles: (props) => <span>✨</span>,
            Zap: (props) => <span>⚡</span>,
            Copy: (props) => <span>📋</span>,
            Check: (props) => <span>✅</span>,
            Clock: (props) => <span>🕐</span>,
            Settings2: (props) => <span>⚙️</span>,
            Plus: (props) => <span>➕</span>,
            Trash2: (props) => <span>🗑️</span>,
            Percent: (props) => <span>％</span>,
            Activity: (props) => <span>📊</span>,
            ShieldAlert: (props) => <span>⚠️</span>,
            UserPlus: (props) => <span>👤➕</span>,
            Hand: (props) => <span>✋</span>,
            ToggleLeft: (props) => <span>◀</span>,
            ToggleRight: (props) => <span>▶</span>,
            Type: (props) => <span>📝</span>,
            Edit3: (props) => <span>✏️</span>,
            GripVertical: (props) => <span>⋮⋮</span>,
            Languages: (props) => <span>🌐</span>,
            Scale: (props) => <span>⚖️</span>,
        };

        const App = () => {
            const [user, setUser] = useState({ uid: 'demo-user-' + Date.now() });
            const [phase, setPhase] = useState('home');
            const [isMultiplayer, setIsMultiplayer] = useState(false);
            const [currentRoomId, setCurrentRoomId] = useState(null);
            const [roomHostId, setRoomHostId] = useState(null);
            const [joinRoomIdInput, setJoinRoomIdInput] = useState('');
            const [playerNameInput, setPlayerNameInput] = useState('');
            const [joinError, setJoinError] = useState('');

            const [title, setTitle] = useState('');
            const [mode, setMode] = useState('individual');
            const [teamCount, setTeamCount] = useState(2);
            const [teamNames, setTeamNames] = useState(['チームA', 'チームB', 'チームC', 'チームD', 'チームE', 'チームF']);
            const [playerListText, setPlayerListText] = useState("");
            const [players, setPlayers] = useState([]);
            const [eliminated, setEliminated] = useState([]);
            const [turn, setTurn] = useState(1);
            const [isSpinning, setIsSpinning] = useState(false);
            const [displayResult, setDisplayResult] = useState({ player: '？？？', amount: '？' });
            const [lastResult, setLastResult] = useState(null);
            const [logs, setLogs] = useState([]);
            const [initialHP, setInitialHP] = useState(1000);
            const [spinDuration, setSpinDuration] = useState(1.5);
            const [healInterval, setHealInterval] = useState(10);

            const [isManualModeEnabled, setIsManualModeEnabled] = useState(false);
            const [isSpecialEventEnabled, setIsSpecialEventEnabled] = useState(false);
            const [specialEventProb, setSpecialEventProb] = useState(10);
            const [enabledSpecialEvents, setEnabledSpecialEvents] = useState([
                'reverseMode', 'multiMode', 'numberFormat', 'nameTranslation', 'feint', 'diceMode',
                'russianRoulette', 'timeBomb', 'kanjiQuiz', 'mathQuiz', 'englishQuiz'
            ]);
            const [isHpBalanceEnabled, setIsHpBalanceEnabled] = useState(false);

            const [manualPlayers, setManualPlayers] = useState([]);
            const [config, setConfig] = useState({
                rangeMin: 1, rangeMax: 20, rangeProb: 70,
                fixedItems: [{ id: 1, value: 50, prob: 20 }, { id: 2, value: 100, prob: 10 }]
            });

            const [animatingPlayerIds, setAnimatingPlayerIds] = useState([]);
            const [animatingType, setAnimatingType] = useState(null);
            const [isLogsCopied, setIsLogsCopied] = useState(false);

            const [diceConfig, setDiceConfig] = useState({ min: 1, max: 100 });
            const [selectedPlayerIds, setSelectedPlayerIds] = useState([]);
            const [isManualSelectionPhase, setIsManualSelectionPhase] = useState(false);

            useEffect(() => {
                if (!isMultiplayer) {
                    const names = playerListText.split('\n').map(n => n.trim()).filter(n => n !== '');
                    const uniqueNames = [...new Set(names)];
                    setManualPlayers(prev => uniqueNames.map((name, index) => {
                        const existing = prev.find(p => p.name === name);
                        if (existing) return existing;
                        return { name, teamIndex: mode === 'team' ? (index % teamCount) : 0 };
                    }));
                }
            }, [playerListText, teamCount, mode, isMultiplayer]);

            const totalProb = (parseInt(config.rangeProb) || 0) + config.fixedItems.reduce((sum, item) => sum + (parseInt(item.prob) || 0), 0);

            const generateAmount = () => {
                const r = Math.random() * 100;
                let currentProb = parseFloat(config.rangeProb) || 0;
                const min = parseInt(config.rangeMin) || 1;
                const max = parseInt(config.rangeMax) || 20;
                if (r < currentProb) return Math.floor(Math.random() * (max - min + 1)) + min;
                for (const item of config.fixedItems) {
                    currentProb += parseFloat(item.prob) || 0;
                    if (r < currentProb) return parseInt(item.value) || 0;
                }
                return max;
            };

            const copyToClipboard = (text, setFeedback) => {
                navigator.clipboard.writeText(text).then(() => {
                    setFeedback(true);
                    setTimeout(() => setFeedback(false), 2000);
                });
            };

            const startGameSingle = () => {
                if (totalProb !== 100 || manualPlayers.length < 2) return;
                const colors = ['text-red-400', 'text-blue-400', 'text-emerald-400', 'text-amber-400', 'text-purple-400', 'text-cyan-400'];
                const initialPlayers = manualPlayers.map((p, index) => {
                    const team = mode === 'team' ? (teamNames[p.teamIndex] || `チーム${String.fromCharCode(65 + p.teamIndex)}`) : null;
                    const teamColor = mode === 'team' ? colors[p.teamIndex % colors.length] : null;
                    return { id: `p-${Date.now()}-${index}`, name: p.name, hp: initialHP, status: 'alive', team: team, teamColor: teamColor, teamIndex: p.teamIndex };
                });
                setPlayers(initialPlayers);
                setPhase('playing');
                setTurn(1);
                setEliminated([]);
                setLogs([]);
                setLastResult(null);
                setIsManualSelectionPhase(false);
                setSelectedPlayerIds([]);
            };

            const spinRoulette = async () => {
                if (isSpinning) return;

                const alivePlayers = players.filter(p => p.status === 'alive');
                if (alivePlayers.length === 0) {
                    setPhase('result');
                    return;
                }

                setIsSpinning(true);
                let spins = 0;
                const intervalMs = 60;
                const maxSpins = Math.max(10, Math.floor((spinDuration * 1000) / intervalMs));

                const spinInterval = setInterval(() => {
                    const randomAlive = alivePlayers[Math.floor(Math.random() * alivePlayers.length)];
                    if (isManualSelectionPhase) {
                        setDisplayResult({ player: "対象を選択してください", amount: generateAmount() });
                    } else {
                        setDisplayResult({ player: randomAlive.name, amount: generateAmount() });
                    }
                    spins++;
                    if (spins >= maxSpins) {
                        clearInterval(spinInterval);
                        finalizeSpin(alivePlayers);
                    }
                }, intervalMs);
            };

            const finalizeSpin = (alivePlayers) => {
                const chosenPlayer = alivePlayers[Math.floor(Math.random() * alivePlayers.length)];
                const finalAmount = generateAmount();

                let updatedPlayers = [...players];
                updatedPlayers = updatedPlayers.map(p =>
                    p.id === chosenPlayer.id ? { ...p, hp: Math.max(0, p.hp - finalAmount) } : p
                );

                const newlyDead = [];
                updatedPlayers = updatedPlayers.map(p => {
                    if (p.status === 'alive' && p.hp <= 0) {
                        newlyDead.push({ name: p.name, turn: turn });
                        return { ...p, hp: 0, status: 'dead' };
                    }
                    return p;
                });

                setPlayers(updatedPlayers);
                if (newlyDead.length > 0) setEliminated(prev => [...prev, ...newlyDead]);
                setLastResult({ player: chosenPlayer.name, amount: finalAmount });
                setAnimatingPlayerIds([chosenPlayer.id]);
                setAnimatingType('damage');

                setTimeout(() => {
                    setIsSpinning(false);
                    const alivePlayersAfter = updatedPlayers.filter(p => p.status === 'alive');
                    if (alivePlayersAfter.length <= 1) {
                        setPhase('result');
                    } else {
                        setTurn(turn + 1);
                    }
                    setAnimatingPlayerIds([]);
                }, 2000);
            };

            const getCombinedRanking = () => {
                const alive = players.filter(p => p.status === 'alive').sort((a, b) => b.hp - a.hp);
                const dead = [...eliminated].reverse().map(e => {
                    const p = players.find(player => player.name === e.name);
                    return { ...p, status: 'dead', turn: e.turn };
                });
                return [...alive, ...dead];
            };

            const backToHome = () => {
                setPhase('home');
                setIsMultiplayer(false);
                setPlayers([]);
                setEliminated([]);
                setLogs([]);
                setTurn(1);
                setDisplayResult({ player: '？？？', amount: '？' });
                setLastResult(null);
            };

            // ホーム画面
            if (phase === 'home') {
                return (
                    <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-6 relative overflow-hidden">
                        <div className="absolute top-1/2 left-1/2 w-[800px] h-[800px] bg-indigo-600/20 rounded-full blur-3xl pointer-events-none" style={{ transform: 'translate(-50%, -50%)' }}></div>
                        <div className="z-10 text-center max-w-xl w-full">
                            <div className="mb-4 inline-block p-4 bg-indigo-900/50 rounded-3xl border border-indigo-500/30 text-4xl">⚔️</div>
                            <h1 className="text-5xl md:text-7xl font-black italic tracking-tighter text-white drop-shadow-2xl mb-12 uppercase leading-none">
                                Survival<br/><span style={{ color: '#a5f3fc' }}>Roulette</span>
                            </h1>
                            <div className="flex flex-col gap-4">
                                <button 
                                    onClick={() => { setIsMultiplayer(false); setPhase('setup'); }}
                                    className="w-full py-5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl font-black text-2xl transition-all shadow-lg flex items-center justify-center gap-3"
                                >
                                    👥 ひとりで遊ぶ
                                </button>
                                <button 
                                    onClick={() => alert('マルチプレイはオフラインモードでは利用できません')}
                                    className="w-full py-5 bg-slate-900 border-2 border-slate-700 hover:border-indigo-500 hover:bg-slate-800 text-slate-300 hover:text-white rounded-2xl font-black text-2xl transition-all flex items-center justify-center gap-3"
                                >
                                    📊 みんなで遊ぶ
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // セットアップ画面（簡略版）
            if (phase === 'setup') {
                return (
                    <div className="min-h-screen bg-slate-950 text-slate-100 p-4 md:p-6 flex items-center justify-center">
                        <div className="w-full max-w-3xl bg-slate-900 rounded-3xl shadow-2xl border border-slate-800 overflow-hidden">
                            <div className="bg-gradient-to-br from-indigo-600 to-indigo-800 p-6 text-center relative overflow-hidden">
                                <h1 className="text-2xl md:text-3xl font-black italic tracking-tighter text-white drop-shadow-lg uppercase">SURVIVAL ROULETTE</h1>
                            </div>
                            
                            <div className="p-6 space-y-6">
                                <div className="space-y-3">
                                    <label className="text-sm font-black text-slate-500 tracking-widest uppercase">タイトル</label>
                                    <input 
                                        type="text" 
                                        value={title} 
                                        onChange={(e) => setTitle(e.target.value)} 
                                        placeholder="ゲームのタイトル..." 
                                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white outline-none focus:border-indigo-500"
                                    />
                                </div>

                                <div className="space-y-3">
                                    <label className="text-sm font-black text-slate-500 tracking-widest uppercase">モード</label>
                                    <div className="flex gap-2">
                                        {['individual', 'team'].map(m => (
                                            <button 
                                                key={m}
                                                onClick={() => setMode(m)} 
                                                className={`flex-1 px-4 py-2 text-sm font-black rounded-lg transition-all ${mode === m ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-500 hover:text-slate-300'}`}
                                            >
                                                {m === 'individual' ? '個人戦' : 'チーム戦'}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="grid grid-cols-3 gap-4">
                                    <div className="space-y-2">
                                        <label className="text-xs font-black text-slate-500 uppercase">初期HP</label>
                                        <input 
                                            type="number" 
                                            value={initialHP} 
                                            onChange={(e) => setInitialHP(Math.max(1, parseInt(e.target.value) || 1))} 
                                            className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white outline-none focus:border-indigo-500"
                                        />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-xs font-black text-slate-500 uppercase">速度</label>
                                        <input 
                                            type="number" 
                                            step="0.1"
                                            value={spinDuration} 
                                            onChange={(e) => setSpinDuration(Math.max(0.1, parseFloat(e.target.value) || 0.1))} 
                                            className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white outline-none focus:border-indigo-500"
                                        />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-xs font-black text-slate-500 uppercase">回復頻度</label>
                                        <input 
                                            type="number" 
                                            value={healInterval} 
                                            onChange={(e) => setHealInterval(Math.max(1, parseInt(e.target.value) || 1))} 
                                            className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white outline-none focus:border-indigo-500"
                                        />
                                    </div>
                                </div>

                                <div className="space-y-3">
                                    <label className="text-sm font-black text-slate-500 tracking-widest uppercase">プレイヤーリスト</label>
                                    <textarea 
                                        value={playerListText} 
                                        onChange={(e) => setPlayerListText(e.target.value)} 
                                        placeholder="名前を改行で入力..." 
                                        className="w-full h-32 bg-slate-950 border border-slate-800 rounded-xl p-4 text-white outline-none focus:ring-2 focus:ring-indigo-500 resize-none custom-scrollbar"
                                    />
                                </div>

                                <div className="space-y-3">
                                    <label className="text-sm font-black text-slate-500 tracking-widest uppercase">ルーレット構成</label>
                                    <div className="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3">
                                        <div className="flex justify-between items-center">
                                            <span className="text-sm font-black text-slate-400">ランダム範囲</span>
                                            <div className="flex items-center gap-2">
                                                <input 
                                                    type="number" 
                                                    value={config.rangeProb} 
                                                    onChange={(e) => setConfig({...config, rangeProb: e.target.value})} 
                                                    className="w-16 bg-slate-900 border border-slate-800 rounded px-2 py-1 text-white text-center"
                                                />
                                                <span>%</span>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <input 
                                                type="number" 
                                                value={config.rangeMin} 
                                                onChange={(e) => setConfig({...config, rangeMin: e.target.value})} 
                                                className="flex-1 bg-slate-900 border border-slate-800 rounded px-3 py-2 text-white text-center"
                                            />
                                            <span>~</span>
                                            <input 
                                                type="number" 
                                                value={config.rangeMax} 
                                                onChange={(e) => setConfig({...config, rangeMax: e.target.value})} 
                                                className="flex-1 bg-slate-900 border border-slate-800 rounded px-3 py-2 text-white text-center"
                                            />
                                        </div>
                                    </div>
                                </div>

                                <div className="flex gap-4 pt-6">
                                    <button 
                                        onClick={() => setPhase('home')} 
                                        className="flex-1 py-4 bg-slate-800 hover:bg-slate-700 text-white font-black rounded-2xl transition-all"
                                    >
                                        戻る
                                    </button>
                                    <button 
                                        onClick={startGameSingle} 
                                        disabled={totalProb !== 100 || manualPlayers.length < 2}
                                        className={`flex-1 py-4 rounded-2xl font-black text-xl transition-all flex items-center justify-center gap-2 ${totalProb === 100 && manualPlayers.length >= 2 ? 'bg-indigo-600 hover:bg-indigo-500 text-white' : 'bg-slate-800 text-slate-600 cursor-not-allowed'}`}
                                    >
                                        ▶️ ゲームスタート
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // ゲーム画面
            if (phase === 'playing') {
                const alivePlayers = players.filter(p => p.status === 'alive');
                const survivorsSorted = alivePlayers.sort((a, b) => b.hp - a.hp);

                return (
                    <div className="min-h-screen bg-slate-950 text-slate-100 p-4 md:p-6 flex flex-col md:flex-row gap-6">
                        <div className="flex-1 flex flex-col gap-6">
                            <div className="bg-slate-900 rounded-3xl p-6 border-b-4 border-indigo-600 flex justify-between items-center shadow-2xl">
                                <div className="flex items-center gap-4">
                                    <div className="w-14 h-14 bg-indigo-600 rounded-2xl flex items-center justify-center font-black text-2xl text-white">{turn}</div>
                                    <div>
                                        <div className="text-indigo-400 font-black text-sm tracking-widest uppercase">{title}</div>
                                        <div className="text-xl font-black italic text-white">BATTLE ROUND</div>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-slate-900 rounded-3xl p-8 border border-slate-800 flex flex-col items-center justify-center relative flex-1 overflow-hidden">
                                <div className="text-center w-full px-6 relative z-10 flex flex-col items-center">
                                    <div className="text-3xl md:text-5xl lg:text-6xl font-black mb-6 tracking-tighter italic truncate max-w-full text-white">
                                        {displayResult.player}
                                    </div>
                                    <div className={`text-6xl md:text-8xl font-black leading-none transition-all duration-75 tabular-nums break-all ${isSpinning ? 'text-slate-800 scale-95' : 'text-red-600'}`}>
                                        {displayResult.amount}
                                    </div>
                                </div>
                                
                                <div className="mt-10 w-full max-w-xs relative z-10">
                                    <button 
                                        onClick={spinRoulette} 
                                        disabled={isSpinning}
                                        className={`w-full py-6 rounded-2xl font-black text-2xl shadow-2xl transition-all active:scale-95 flex items-center justify-center gap-4 ${isSpinning ? 'bg-slate-800 text-slate-600' : 'bg-red-600 hover:bg-red-500 text-white'}`}
                                    >
                                        {isSpinning ? '🔄' : '▶️'} {isSpinning ? 'SPINNING...' : 'SPIN'}
                                    </button>
                                </div>
                            </div>

                            <div className="bg-slate-900 rounded-3xl p-6 border border-slate-800 flex flex-col overflow-hidden h-40">
                                <div className="text-slate-500 font-black text-sm tracking-widest uppercase mb-4">📜 LOGS</div>
                                <div className="overflow-y-auto flex-1 space-y-2 custom-scrollbar">
                                    {logs.slice(0, 10).map((log, idx) => (
                                        <div key={idx} className="text-xs font-bold text-slate-400">
                                            <span className="text-slate-600">T{log.turn}:</span> {log.message}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="md:w-80 flex flex-col gap-6">
                            <div className="bg-slate-900 rounded-3xl p-6 border border-slate-800 flex flex-col h-96 overflow-hidden">
                                <div className="text-slate-500 font-black text-sm tracking-widest uppercase mb-4 flex items-center justify-between">
                                    <span>👥 Survivors</span>
                                    <span className="bg-indigo-600 text-white px-3 py-1 rounded-full text-xs">{survivorsSorted.length}</span>
                                </div>
                                <div className="space-y-2 overflow-y-auto flex-1 custom-scrollbar">
                                    {survivorsSorted.map(p => {
                                        const isLowHp = p.hp <= initialHP * 0.3;
                                        return (
                                            <div 
                                                key={p.id}
                                                className={`bg-slate-950 p-3 rounded-xl border flex justify-between items-center ${isLowHp ? 'border-red-900 bg-red-950/10' : 'border-slate-800'}`}
                                            >
                                                <span className={`font-bold text-sm ${isLowHp ? 'text-red-400' : 'text-slate-200'}`}>{p.name}</span>
                                                <span className={`text-lg font-black tabular-nums ${isLowHp ? 'text-red-500' : 'text-emerald-400'}`}>{p.hp}</span>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="bg-slate-900 rounded-3xl p-6 border border-slate-800 flex flex-col flex-1 overflow-hidden">
                                <div className="text-slate-500 font-black text-sm tracking-widest uppercase mb-4">🏆 Ranking</div>
                                <div className="space-y-2 overflow-y-auto flex-1 custom-scrollbar">
                                    {getCombinedRanking().map((p, idx) => {
                                        const isAlive = p.status === 'alive';
                                        return (
                                            <div key={idx} className={`flex items-center justify-between p-3 rounded-xl border ${isAlive ? 'bg-slate-900 border-slate-700' : 'bg-slate-950/60 border-slate-900 opacity-60'}`}>
                                                <div className="flex items-center gap-2 flex-1">
                                                    <span className="font-black text-sm w-6">{idx + 1}</span>
                                                    <span className={`font-bold text-sm truncate ${isAlive ? 'text-white' : 'text-slate-400'}`}>{p.name}</span>
                                                </div>
                                                {isAlive ? (
                                                    <span className="font-black text-xs px-3 py-1 rounded-lg bg-emerald-500/10 text-emerald-400">HP {p.hp}</span>
                                                ) : (
                                                    <span className="text-slate-500 font-bold text-xs">T{p.turn}脱落</span>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // リザルト画面
            if (phase === 'result') {
                const ranking = getCombinedRanking();
                const alivePlayers = players.filter(p => p.status === 'alive');
                const hasWinner = alivePlayers.length > 0;

                return (
                    <div className="min-h-screen bg-slate-950 text-slate-100 p-4 md:p-8 flex flex-col items-center justify-center">
                        <div className="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl flex flex-col gap-6">
                            <div className="text-center">
                                <div className="mb-4 inline-block text-5xl">🏆</div>
                                <h1 className="text-5xl font-black italic uppercase tracking-tighter text-white mb-2">RESULT</h1>
                                <p className="text-slate-400 text-xs font-bold uppercase tracking-widest">生存競争、決着</p>
                            </div>

                            <div className="bg-slate-950 border border-slate-800/80 rounded-3xl p-6 text-center">
                                <div className="text-xs font-black text-indigo-400 tracking-widest uppercase mb-2">WINNER</div>
                                {hasWinner ? (
                                    <div>
                                        <div className="text-3xl font-black text-amber-400 mb-2">{alivePlayers[0].name}</div>
                                        <div className="text-slate-400 text-sm font-bold">第{turn}ターンを耐え抜き、勝利を掴み取った！</div>
                                    </div>
                                ) : (
                                    <div className="text-slate-500 font-bold text-lg">勝者なし (全員脱落)</div>
                                )}
                            </div>

                            <div className="space-y-4">
                                <label className="text-xs font-black text-slate-500 uppercase tracking-widest">最終順位</label>
                                <div className="space-y-2 max-h-64 overflow-y-auto custom-scrollbar">
                                    {ranking.map((p, idx) => {
                                        const isAlive = p.status === 'alive';
                                        const isFirst = idx === 0 && isAlive;
                                        return (
                                            <div key={idx} className={`flex items-center justify-between p-4 rounded-2xl border transition-all ${isFirst ? 'bg-indigo-600/30 border-indigo-400' : isAlive ? 'bg-slate-900 border-slate-700' : 'bg-slate-950/60 border-slate-900 opacity-60'}`}>
                                                <div className="flex items-center gap-3 flex-1">
                                                    <span className={`font-black text-lg w-8 ${isFirst ? 'text-amber-400' : 'text-slate-500'}`}>{idx + 1}</span>
                                                    <span className={`font-bold text-base truncate ${isAlive ? 'text-white' : 'text-slate-400'}`}>{p.name}</span>
                                                </div>
                                                {isAlive ? (
                                                    <span className="font-black text-sm px-3 py-1 rounded-lg border bg-emerald-500/10 text-emerald-400 border-emerald-500/20">HP {p.hp}</span>
                                                ) : (
                                                    <span className="text-slate-500 font-bold text-xs px-3 py-1 bg-slate-800/40 rounded-lg border border-slate-800/50">T{p.turn}脱落</span>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="flex gap-4 pt-6">
                                <button 
                                    onClick={backToHome} 
                                    className="flex-1 py-4 bg-slate-800 hover:bg-slate-700 text-white font-black rounded-2xl border border-slate-700 transition-all"
                                >
                                    🏠 ホームに戻る
                                </button>
                                <button 
                                    onClick={startGameSingle} 
                                    className="flex-1 py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-black rounded-2xl shadow-lg transition-all"
                                >
                                    ▶️ もう一度遊ぶ
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return null;
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
