<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Roulette - ゲーム</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
            border: 2px solid transparent;
            background-clip: padding-box;
        }
        
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        [draggable="true"] {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        @keyframes slide-out-to-top {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(-2rem);
            }
        }
        
        .slide-out-to-top-8 {
            animation: slide-out-to-top 1s ease-out forwards;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .animate-bounce {
            animation: bounce 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        
        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script>
        const { useState, useEffect, useRef } = React;
        const lucideIcons = lucide;
        const { Heart, Skull, History, Swords, Trophy, RotateCcw, Play, Sparkles, Zap, Copy, Check, Clock, Settings2, Plus, Trash2, Percent, Activity, ShieldAlert, UserPlus, Hand, ToggleLeft, ToggleRight, Type, Edit3, GripVertical, Languages, Scale, Users } = lucideIcons;

        // Firebase Initialization
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForDemo",
            authDomain: "dummy.firebaseapp.com",
            projectId: "dummy-project",
            storageBucket: "dummy.appspot.com",
            messagingSenderId: "000000000000",
            appId: "1:000000000000:web:0000000000000000"
        };

        let app, auth, db;
        const hasFirebaseConfig = false; // オフラインモード

        const App = () => {
            const [user, setUser] = useState(null);
            const [phase, setPhase] = useState('home');
            const [isMultiplayer, setIsMultiplayer] = useState(false);
            const [currentRoomId, setCurrentRoomId] = useState(null);
            const [roomHostId, setRoomHostId] = useState(null);
            const [joinRoomIdInput, setJoinRoomIdInput] = useState('');
            const [playerNameInput, setPlayerNameInput] = useState('');
            const [joinError, setJoinError] = useState('');

            const [title, setTitle] = useState('');
            const [mode, setMode] = useState('individual');
            const [teamCount, setTeamCount] = useState(2);
            const [teamNames, setTeamNames] = useState(['チームA', 'チームB', 'チームC', 'チームD', 'チームE', 'チームF']);
            const [playerListText, setPlayerListText] = useState("");
            const [players, setPlayers] = useState([]);
            const [eliminated, setEliminated] = useState([]);
            const [turn, setTurn] = useState(1);
            const [isSpinning, setIsSpinning] = useState(false);
            const [displayResult, setDisplayResult] = useState({ player: '？？？', amount: '？' });
            const [lastResult, setLastResult] = useState(null);
            const [logs, setLogs] = useState([]);
            const [initialHP, setInitialHP] = useState(1000);
            const [spinDuration, setSpinDuration] = useState(1.5);
            const [healInterval, setHealInterval] = useState(10);
            const [isManualModeEnabled, setIsManualModeEnabled] = useState(false);
            const [isSpecialEventEnabled, setIsSpecialEventEnabled] = useState(false);
            const [specialEventProb, setSpecialEventProb] = useState(10);
            const [enabledSpecialEvents, setEnabledSpecialEvents] = useState([
                'reverseMode', 'multiMode', 'numberFormat', 'nameTranslation', 'feint', 'diceMode', 'reverseHealDamage', 'instantDeath', 'trueRandom',
                'russianRoulette', 'timeBomb', 'kanjiQuiz', 'mathQuiz', 'englishQuiz'
            ]);
            const [isHpBalanceEnabled, setIsHpBalanceEnabled] = useState(false);
            const [numberFormat, setNumberFormat] = useState('default');
            const [nameLanguage, setNameLanguage] = useState('default');
            const [translatedMap, setTranslatedMap] = useState({});
            const [activeMinigame, setActiveMinigame] = useState(null);
            const [minigameLocalState, setMinigameLocalState] = useState({});

            const [config, setConfig] = useState({
                rangeMin: 1, rangeMax: 20, rangeProb: 70,
                fixedItems: [{ id: 1, value: 50, prob: 20 }, { id: 2, value: 100, prob: 10 }]
            });

            const [reviveEvents, setReviveEvents] = useState([
                { id: 1, turn: 50, type: 'steal' }, { id: 2, turn: 100, type: 'copy' }
            ]);

            const [animatingPlayerIds, setAnimatingPlayerIds] = useState([]);
            const [animatingType, setAnimatingType] = useState(null);
            const [isLogsCopied, setIsLogsCopied] = useState(false);
            const [isRankingCopied, setIsRankingCopied] = useState(false);
            const [isDiscordCopied, setIsDiscordCopied] = useState(false);
            const [draggedPlayer, setDraggedPlayer] = useState(null);
            const [touchTargetTeam, setTouchTargetTeam] = useState(null);
            const [manualPlayers, setManualPlayers] = useState([]);
            const [selectedPlayerIds, setSelectedPlayerIds] = useState([]);
            const [isManualSelectionPhase, setIsManualSelectionPhase] = useState(false);
            const [diceConfig, setDiceConfig] = useState({ min: 1, max: 100 });
            const [enabledFormats, setEnabledFormats] = useState(['roman', 'greek', 'kanji']);
            const [enabledLangs, setEnabledLangs] = useState(['英語(アメリカ)']);

            useEffect(() => {
                if (!isMultiplayer) {
                    const names = playerListText.split('\n').map(n => n.trim()).filter(n => n !== '');
                    const uniqueNames = [...new Set(names)];
                    setManualPlayers(prev => uniqueNames.map((name, index) => {
                        const existing = prev.find(p => p.name === name);
                        if (existing) return existing;
                        return { name, teamIndex: mode === 'team' ? (index % teamCount) : 0 };
                    }));
                }
            }, [playerListText, teamCount, mode, isMultiplayer]);

            const copyToClipboard = (text, setFeedback) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    setFeedback(true);
                    setTimeout(() => setFeedback(false), 2000);
                } catch (err) {
                    console.error("Copy failed:", err);
                }
                document.body.removeChild(textArea);
            };

            const totalProb = (parseInt(config.rangeProb) || 0) + config.fixedItems.reduce((sum, item) => sum + (parseInt(item.prob) || 0), 0);

            const generateAmount = () => {
                const r = Math.random() * 100;
                let currentProb = config.rangeProb;
                if (r < currentProb) return Math.floor(Math.random() * (config.rangeMax - config.rangeMin + 1)) + config.rangeMin;
                for (const item of config.fixedItems) {
                    currentProb += item.prob;
                    if (r < currentProb) return item.value;
                }
                return config.rangeMax;
            };

            const startGameSingle = () => {
                if (totalProb !== 100 || manualPlayers.length < 2) return;
                const colors = ['text-red-400', 'text-blue-400', 'text-emerald-400', 'text-amber-400', 'text-purple-400', 'text-cyan-400'];
                const initialPlayers = manualPlayers.map((p, index) => {
                    const team = mode === 'team' ? (teamNames[p.teamIndex] || `チーム${String.fromCharCode(65 + p.teamIndex)}`) : null;
                    const teamColor = mode === 'team' ? colors[p.teamIndex % colors.length] : null;
                    return { id: `p-${Date.now()}-${index}`, name: p.name, hp: initialHP, status: 'alive', team: team, teamColor: teamColor, teamIndex: p.teamIndex };
                });
                setPlayers(initialPlayers);
                setPhase('playing');
                setTurn(1);
                setEliminated([]);
                setLogs([]);
                setLastResult(null);
                setActiveMinigame(null);
                setIsManualSelectionPhase(false);
                setSelectedPlayerIds([]);
            };

            const spinRoulette = async () => {
                if (isSpinning) return;
                
                setIsSpinning(true);
                setDisplayResult({ player: '？？？', amount: '？' });
                
                const alivePlayers = players.filter(p => p.status === 'alive');
                if (alivePlayers.length === 0) {
                    setPhase('result');
                    setIsSpinning(false);
                    return;
                }

                let spins = 0;
                const intervalMs = 60;
                const maxSpins = Math.max(10, Math.floor((spinDuration * 1000) / intervalMs));

                const spinInterval = setInterval(() => {
                    const randomPlayer = alivePlayers[Math.floor(Math.random() * alivePlayers.length)];
                    const randomAmount = generateAmount();
                    setDisplayResult({ player: randomPlayer.name, amount: randomAmount });
                    spins++;

                    if (spins >= maxSpins) {
                        clearInterval(spinInterval);
                        
                        // ゲーム終了判定
                        const finalAmount = generateAmount();
                        setDisplayResult({ player: randomPlayer.name, amount: finalAmount });
                        setLastResult({ player: randomPlayer.name, amount: finalAmount, type: 'damage' });
                        
                        const updatedPlayers = players.map(p => {
                            if (p.id === randomPlayer.id) {
                                return { ...p, hp: Math.max(0, p.hp - finalAmount) };
                            }
                            return p;
                        });

                        const newlyDead = updatedPlayers.filter(p => p.status === 'alive' && p.hp <= 0);
                        const finalPlayers = updatedPlayers.map(p => {
                            if (p.status === 'alive' && p.hp <= 0) {
                                setEliminated(prev => [...prev, { name: p.name, turn: turn }]);
                                return { ...p, hp: 0, status: 'dead' };
                            }
                            return p;
                        });

                        setPlayers(finalPlayers);
                        setLogs(prev => [...prev, { id: Date.now(), turn: turn, type: 'damage', message: `${randomPlayer.name}に${finalAmount}ダメージ` }].slice(0, 100));

                        setTimeout(() => {
                            setIsSpinning(false);
                            const remainingAlive = finalPlayers.filter(p => p.status === 'alive');
                            if (remainingAlive.length <= 1) {
                                setPhase('result');
                            } else {
                                setTurn(turn + 1);
                            }
                        }, 1000);
                    }
                }, intervalMs);
            };

            const getCombinedRanking = () => {
                const alive = players.filter(p => p.status === 'alive').sort((a, b) => b.hp - a.hp);
                const dead = eliminated.reverse().map(e => {
                    const p = players.find(player => player.name === e.name);
                    return { ...p, status: 'dead', turn: e.turn };
                });
                return [...alive, ...dead];
            };

            const copyRanking = () => {
                const ranking = getCombinedRanking();
                const rankingText = `${title}\nランキング結果（第${turn}ターン）\n` + ranking.map((p, i) => `${i + 1}位: ${p.name} (HP: ${p.hp})`).join('\n');
                copyToClipboard(rankingText, setIsRankingCopied);
            };

            const backToHome = () => {
                setPhase('home');
                setIsMultiplayer(false);
                setPlayers([]);
                setEliminated([]);
                setLogs([]);
                setTurn(1);
                setDisplayResult({ player: '？？？', amount: '？' });
                setLastResult(null);
            };

            const RankingList = ({ ranking }) => (
                <div className="space-y-2 overflow-y-auto flex-1 pr-1 custom-scrollbar">
                    {ranking.map((p, index) => {
                        const isAlive = p.status === 'alive';
                        const isFirst = index === 0 && isAlive;
                        return (
                            <div key={index} className={`flex items-center justify-between p-4 rounded-2xl border transition-all ${isFirst ? 'bg-indigo-600/30 border-indigo-400' : isAlive ? 'bg-slate-900 border-slate-700' : 'bg-slate-950/60 border-slate-900 opacity-60'}`}>
                                <div className="flex items-center gap-4">
                                    <span className={`font-black text-lg w-8 ${isFirst ? 'text-amber-400' : 'text-slate-500'}`}>{index + 1}</span>
                                    <span className={`font-bold text-base ${isAlive ? 'text-white' : 'text-slate-400'}`}>{p.name}</span>
                                </div>
                                <div className="text-right">
                                    {isAlive ? <span className="font-black text-sm px-3 py-1.5 rounded-xl bg-emerald-500/10 text-emerald-400">HP {p.hp}</span> : <span className="text-slate-500 font-bold text-xs">脱落</span>}
                                </div>
                            </div>
                        );
                    })}
                </div>
            );

            if (phase === 'home') {
                return (
                    <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-6 relative overflow-hidden">
                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-indigo-600/20 rounded-full blur-[120px] pointer-events-none"></div>
                        <div className="z-10 text-center max-w-xl w-full">
                            <div className="mb-4 inline-block p-4 bg-indigo-900/50 rounded-3xl border border-indigo-500/30">
                                <Swords size={48} className="text-indigo-400"/>
                            </div>
                            <h1 className="text-5xl md:text-7xl font-black italic tracking-tighter text-white drop-shadow-2xl mb-12 uppercase leading-none">Survival<br/><span className="text-indigo-400">Roulette</span></h1>
                            <div className="flex flex-col gap-4">
                                <button onClick={() => { setIsMultiplayer(false); setPhase('setup'); }} className="w-full py-5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl font-black text-2xl transition-all shadow-[0_0_30px_rgba(79,70,229,0.4)] flex items-center justify-center gap-3">
                                    <Users size={24}/> ひとりで遊ぶ
                                </button>
                                <button onClick={() => alert('マルチプレイ機能はデモ版では使用できません。')} className="w-full py-5 bg-slate-900 border-2 border-slate-700 hover:border-indigo-500 hover:bg-slate-800 text-slate-300 hover:text-white rounded-2xl font-black text-2xl transition-all flex items-center justify-center gap-3">
                                    <Activity size={24}/> みんなで遊ぶ
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (phase === 'setup') {
                return (
                    <div className="min-h-screen bg-slate-950 text-slate-100 p-4 md:p-6 flex items-center justify-center">
                        <div className="w-full max-w-5xl bg-slate-900 rounded-[2.5rem] shadow-2xl border border-slate-800 overflow-hidden">
                            <div className="bg-gradient-to-br from-indigo-600 to-indigo-800 p-6 text-center">
                                <h1 className="text-3xl font-black italic tracking-tighter text-white drop-shadow-lg uppercase">SURVIVAL ROULETTE</h1>
                            </div>
                            
                            <div className="p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 overflow-y-auto custom-scrollbar">
                                {/* 左側設定 */}
                                <div className="space-y-4">
                                    <label className="text-[10px] font-black text-slate-500 tracking-widest uppercase px-1">基本設定</label>
                                    <div className="p-3 bg-slate-950 rounded-2xl border border-slate-800 space-y-2">
                                        <label className="text-[8px] font-black text-slate-500 tracking-widest uppercase">タイトル</label>
                                        <input type="text" value={title} onChange={(e) => setTitle(e.target.value)} placeholder="ゲームタイトル" className="bg-transparent text-sm font-bold w-full outline-none text-white border-b border-slate-800 focus:border-indigo-500 pb-1" />
                                    </div>
                                    <div className="flex gap-1">
                                        {['individual', 'team'].map(m => (
                                            <button key={m} onClick={() => setMode(m)} className={`flex-1 px-4 py-1.5 text-[10px] font-black rounded-lg transition-all ${mode === m ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-500'}`}>
                                                {m === 'individual' ? '個人戦' : 'チーム戦'}
                                            </button>
                                        ))}
                                    </div>
                                    
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="p-3 bg-slate-950 rounded-2xl border border-slate-800">
                                            <label className="text-[8px] font-black text-slate-500 block mb-1 uppercase">初期HP</label>
                                            <input type="number" value={initialHP} onChange={(e) => setInitialHP(Math.max(1, parseInt(e.target.value) || 1))} className="bg-transparent text-lg font-black w-full outline-none text-indigo-400" />
                                        </div>
                                        <div className="p-3 bg-slate-950 rounded-2xl border border-slate-800">
                                            <label className="text-[8px] font-black text-slate-500 block mb-1 uppercase">速度</label>
                                            <input type="number" step="0.1" value={spinDuration} onChange={(e) => setSpinDuration(Math.max(0.1, parseFloat(e.target.value) || 0.1))} className="bg-transparent text-lg font-black w-full outline-none text-amber-500" />
                                        </div>
                                    </div>

                                    <div className="border-t border-slate-800 pt-4 mt-4">
                                        <label className="text-[10px] font-black text-slate-500 tracking-widest block mb-2 uppercase">プレイヤーリスト</label>
                                        <textarea value={playerListText} onChange={(e) => setPlayerListText(e.target.value)} placeholder="名前を改行で入力..." className="w-full bg-slate-950 border border-slate-800 rounded-2xl p-4 outline-none focus:ring-2 focus:ring-indigo-500 font-bold text-sm min-h-[200px] custom-scrollbar resize-none" />
                                    </div>
                                </div>

                                {/* 中央チーム分け */}
                                <div className="space-y-4">
                                    <label className="text-[10px] font-black text-slate-500 tracking-widest uppercase">チーム分け</label>
                                    <div className="bg-slate-950 rounded-2xl border border-slate-800 p-4 min-h-[300px] overflow-y-auto custom-scrollbar">
                                        {mode === 'individual' ? (
                                            manualPlayers.length === 0 ? <p className="text-[10px] text-slate-600 font-bold text-center mt-10">名前を入力してください</p> : manualPlayers.map((p, idx) => (
                                                <div key={idx} className="flex items-center gap-2 bg-slate-900 p-2 rounded-xl border border-slate-800/50 mb-2">
                                                    <span className="text-xs font-bold truncate">{p.name}</span>
                                                </div>
                                            ))
                                        ) : (
                                            <div className="space-y-3">
                                                {Array.from({ length: teamCount }).map((_, idx) => (
                                                    <div key={idx} className="p-3 bg-slate-900 rounded-2xl border border-slate-800">
                                                        <h4 className="text-[9px] font-black text-indigo-400 uppercase mb-2">{teamNames[idx] || `チーム${String.fromCharCode(65 + idx)}`}</h4>
                                                        <div className="space-y-1">
                                                            {manualPlayers.filter(p => p.teamIndex === idx).map(p => (
                                                                <div key={p.name} className="bg-slate-950 px-2 py-1 rounded text-[10px] font-bold">{p.name}</div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* 右側ルール */}
                                <div className="space-y-4 flex flex-col">
                                    <label className="text-[10px] font-black text-slate-500 uppercase">ルーレット構成</label>
                                    <div className="p-4 bg-slate-950 rounded-2xl border border-slate-800 space-y-3 flex-1">
                                        <div className="flex justify-between">
                                            <span className="text-[10px] font-black text-slate-400">ランダム範囲</span>
                                            <span className="text-indigo-400 font-black">{config.rangeProb}%</span>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <input type="number" value={config.rangeMin} onChange={(e) => setConfig({...config, rangeMin: parseInt(e.target.value) || 1})} className="w-full bg-slate-900 p-2 rounded text-center font-black text-xs" />
                                            <span>~</span>
                                            <input type="number" value={config.rangeMax} onChange={(e) => setConfig({...config, rangeMax: parseInt(e.target.value) || 1})} className="w-full bg-slate-900 p-2 rounded text-center font-black text-xs" />
                                        </div>
                                        {config.fixedItems.map(item => (
                                            <div key={item.id} className="p-2 bg-slate-900 rounded flex gap-2">
                                                <input type="number" value={item.value} onChange={(e) => setConfig({...config, fixedItems: config.fixedItems.map(i => i.id === item.id ? {...i, value: parseInt(e.target.value) || 1} : i)})} className="w-12 bg-slate-800 p-1 rounded text-center font-black text-xs" />
                                                <input type="number" value={item.prob} onChange={(e) => setConfig({...config, fixedItems: config.fixedItems.map(i => i.id === item.id ? {...i, prob: parseInt(e.target.value) || 0} : i)})} className="flex-1 bg-slate-800 p-1 rounded text-center font-black text-xs" />
                                                <span className="text-slate-500 text-xs">%</span>
                                            </div>
                                        ))}
                                    </div>
                                    
                                    <button onClick={startGameSingle} disabled={totalProb !== 100 || manualPlayers.length < 2} className={`py-4 rounded-2xl font-black text-lg transition-all ${totalProb === 100 && manualPlayers.length >= 2 ? 'bg-indigo-600 hover:bg-indigo-500 text-white' : 'bg-slate-800 text-slate-600 cursor-not-allowed'}`}>
                                        <Play className="inline mr-2" size={18}/> BATTLE START
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (phase === 'result') {
                const combinedRanking = getCombinedRanking();
                const alivePlayers = players.filter(p => p.status === 'alive');
                const hasWinner = alivePlayers.length > 0;

                return (
                    <div className="min-h-screen bg-slate-950 text-slate-100 p-4 md:p-8 flex flex-col items-center justify-center">
                        <div className="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-[2.5rem] p-6 md:p-10 shadow-2xl flex flex-col gap-6">
                            <div className="text-center">
                                <div className="inline-block p-4 bg-indigo-900/30 rounded-3xl border border-indigo-500/20 mb-3">
                                    <Trophy size={36} className="text-amber-400"/>
                                </div>
                                <h1 className="text-4xl md:text-5xl font-black italic uppercase tracking-tighter text-white mb-2">RESULT</h1>
                                <p className="text-slate-400 text-xs font-bold uppercase">生存競争、決着</p>
                            </div>

                            <div className="bg-slate-950 border border-slate-800 rounded-3xl p-6 text-center">
                                <div className="text-[10px] font-black text-indigo-400 tracking-widest uppercase mb-2">WINNER</div>
                                {hasWinner ? (
                                    <div className="text-3xl font-black text-amber-400">{alivePlayers[0].name}</div>
                                ) : (
                                    <div className="text-slate-500 font-bold">勝者なし (全員脱落)</div>
                                )}
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div className="bg-slate-950 border border-slate-800 rounded-2xl p-4">
                                    <label className="text-[10px] font-black text-slate-500 uppercase mb-3 block">最終順位</label>
                                    <RankingList ranking={combinedRanking} />
                                </div>

                                <div className="flex flex-col gap-3">
                                    <button onClick={copyRanking} className="p-3 bg-slate-900 border border-slate-800 hover:border-indigo-500 rounded-xl font-bold text-xs flex items-center justify-center gap-2">
                                        {isRankingCopied ? <Check size={14} className="text-emerald-400"/> : <Copy size={14}/>} テキスト出力
                                    </button>
                                    <button onClick={() => setPhase('home')} className="p-3 bg-slate-900 border border-slate-800 hover:border-indigo-500 rounded-xl font-bold text-xs">
                                        ホームに戻る
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // Playing Phase
            const alivePlayers = players.filter(p => p.status === 'alive');
            const isGameOver = alivePlayers.length <= 1;

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 p-4 md:p-6 flex flex-col md:flex-row gap-6">
                    <div className="flex-1 flex flex-col gap-6">
                        <div className="bg-slate-900 rounded-3xl p-6 border-b-4 border-indigo-600 flex justify-between items-center shadow-2xl">
                            <div className="flex items-center gap-5">
                                <div className="w-14 h-14 bg-indigo-600 rounded-2xl flex items-center justify-center font-black text-2xl text-white">{turn}</div>
                                <div>
                                    <div className="text-indigo-400 font-black text-xs uppercase">{title}</div>
                                    <div className="text-xl font-black italic text-white">BATTLE ROUND</div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-slate-900 rounded-[3rem] p-8 border border-slate-800 flex flex-col items-center justify-center flex-1 overflow-hidden">
                            <div className="text-center w-full px-6">
                                <div className="text-3xl md:text-5xl font-black mb-6 tracking-tighter italic text-white">{displayResult.player}</div>
                                <div className={`text-6xl md:text-8xl font-black leading-none transition-all duration-75 tabular-nums ${isSpinning ? 'text-slate-800' : 'text-red-600'}`}>
                                    {displayResult.amount}
                                </div>
                            </div>
                            
                            <div className="mt-10 w-full max-w-xs">
                                <button onClick={spinRoulette} disabled={isSpinning || isGameOver} className={`w-full py-6 rounded-2xl font-black text-2xl shadow-2xl transition-all flex items-center justify-center gap-4 ${isSpinning || isGameOver ? 'bg-slate-800 text-slate-600' : 'bg-red-600 hover:bg-red-500 text-white'}`}>
                                    {isSpinning ? <RotateCcw className="animate-spin" /> : <Zap size={24}/>} {isGameOver ? 'GAME OVER' : 'SPIN'}
                                </button>
                            </div>
                        </div>

                        <div className="bg-slate-900 rounded-3xl p-6 border border-slate-800">
                            <div className="text-slate-500 font-black text-xs uppercase mb-3">ログ</div>
                            <div className="space-y-2 overflow-y-auto max-h-32 custom-scrollbar">
                                {logs.slice(0, 20).map((log) => (
                                    <div key={log.id} className="text-xs font-bold text-slate-400 flex gap-2">
                                        <span className="text-slate-600 shrink-0">T{log.turn}:</span>
                                        <span className="text-slate-300">{log.message}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="md:w-80 flex flex-col gap-6">
                        <div className="bg-slate-900 rounded-2xl p-6 border border-slate-800 flex-1">
                            <div className="text-slate-500 font-black text-xs mb-4 uppercase">サバイバー</div>
                            <div className="space-y-3 overflow-y-auto custom-scrollbar max-h-96">
                                {alivePlayers.map(p => (
                                    <div key={p.id} className="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
                                        <span className="font-bold">{p.name}</span>
                                        <span className="text-emerald-400 font-black">HP {p.hp}</span>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="bg-slate-900 rounded-2xl p-6 border border-slate-800 flex-1">
                            <div className="text-slate-500 font-black text-xs mb-4 uppercase">ランキング</div>
                            <RankingList ranking={getCombinedRanking()} />
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
